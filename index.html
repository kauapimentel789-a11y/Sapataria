  const base = orc ? orc.unidade : uDef();
  const o = id ? get(id) : {
    unidade:base, numero:UN(base).proxNumero, entrada:hoje(), prazo:addDia(hoje(),3),
    pares:orc ? orc.pares : [], prioridade:'normal', valor:orc ? orc.valor || '' : '', desconto:0,
    cliente:orc ? orc.cliente : '', telefone:orc ? orc.telefone : '', obs:orc ? orc.obs : ''
  };
  PARES = (o.pares||[]).map(p => ({ fazer:p.fazer||'', horas:+p.horas || +C().tempoPar || 1, valor:+p.valor > 0 ? +p.valor : '', entregue:p.entregue || '' }));
  if(!PARES.length) PARES = [{ fazer:'', horas:+C().tempoPar || 1, valor:'' }];
  PAR_ATIVO = 0;
  PAGS = id ? (o.pagamentos||[]).map(p => ({ data:p.data, dia:diaDe(p.data) || hoje(), valor:+p.valor || '', forma:p.forma || 'Pix' })) : [];
  modal(`
  <h3>${id ? `Editar OS #${o.numero}` : orc ? `Dar entrada no serviço · orçamento ${orc.numero}` : 'Nova Ordem de Serviço'}</h3>
  ${id ? `<div class="hint" style="margin-bottom:6px">Aqui dá para mudar tudo: o que foi feito, valores, pagamentos e status. Cada alteração fica registrada no histórico da OS.</div>` : ''}
  ${orc ? `<div class="hint" style="margin-bottom:6px">Dados trazidos do orçamento. Confira, ajuste o prazo e salve para o serviço entrar na produção.</div>` : ''}
  <label>Unidade</label>
  <div class="pg" id="pu" data-new="${id ? '' : '1'}" style="grid-template-columns:1fr 1fr">
    ${C().unidades.map(u => `<label class="${u.id===o.unidade?'on':''}"><input type="radio" name="fu" value="${u.id}" ${u.id===o.unidade?'checked':''} onchange="unSel()">🏬 ${h(u.curto)}</label>`).join('')}
  </div>
  <label>Número da OS (editável · a numeração é separada por unidade)</label>
  <input id="fn" type="number" min="1" inputmode="numeric" value="${o.numero}">
  <div class="row">
    <div><label>Cliente</label><input id="fc" value="${h(o.cliente||'')}"></div>
    <div><label>Telefone com DDD</label><input id="ft" type="tel" inputmode="tel" placeholder="(11) 99999-9999" value="${h(o.telefone||'')}"></div>
  </div>
  <div class="row">
    <div><label>Data que o cliente deixou</label><input id="fe" type="date" value="${o.entrada}"></div>
    <div><label>Prazo prometido</label><input id="fp" type="date" value="${o.prazo}"></div>
  </div>
  <label>Conserto — um par por aba</label>
  <div id="pares"></div>
  <div class="row3">
    <div><label>Valor total (R$)</label><input id="fv" type="number" step="0.01" inputmode="decimal" value="${o.valor}" oninput="atuPag()"></div>
    <div><label>Prioridade</label><select id="fpr"><option>normal</option><option ${o.prioridade==='urgente'?'selected':''}>urgente</option></select></div>
    <div><label>Responsável</label><input id="fr" value="${h(o.responsavel||'')}"></div>
  </div>
  ${id ? `
  <h4>Situação e desconto</h4>
  <div class="row">
    <div><label>Status</label><select id="fst">${stOpcoes(o.status)}</select></div>
    <div><label>Desconto (R$)</label><input id="fds" type="number" min="0" step="0.01" inputmode="decimal" value="${+o.desconto||0}" oninput="atuPag()"></div>
  </div>
  <h4>Pagamentos (o que já entrou)</h4>
  <div class="hint" style="margin-bottom:6px">Corrija valor, forma ou data de qualquer pagamento, remova o que foi lançado errado ou adicione o que faltou.</div>
  <div id="pags"></div>
  <button type="button" class="b sec sm" onclick="pagAdd()">+ Adicionar pagamento</button>
  <div class="resumo r4" id="pgr2"></div>` : `
  <h4>💰 O cliente pagou alguma coisa agora?</h4>
  <div class="pg" id="pg">
    <label class="on"><input type="radio" name="pgt" value="nenhum" checked onchange="pgSel()">⏳ Não pagou<small>paga tudo na retirada</small></label>
    <label><input type="radio" name="pgt" value="entrada" onchange="pgSel()">💵 Pagou uma parte<small>deu um sinal</small></label>
    <label><input type="radio" name="pgt" value="total" onchange="pgSel()">✅ Pagou tudo<small>já está quitado</small></label>
  </div>
  <div id="pgx" style="display:none">
    <div class="row">
      <div id="pgv"><label>Quanto pagou agora (R$)</label><input id="fev" type="number" step="0.01" inputmode="decimal" oninput="pgSel()"></div>
      <div><label>Forma</label><select id="fef">${optForma('Pix')}</select></div>
    </div>
    <div id="pgq" class="seg" style="margin:-4px 0 8px"></div>
  </div>
  <div class="resumo" id="pgr"></div>`}
  <label>Observações</label><textarea id="fo">${h(o.obs||'')}</textarea>
  ${id ? '' : `<label style="display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600;cursor:pointer"><input type="checkbox" id="fetq" style="width:auto;margin:0" ${localStorage.getItem('sap_etq') !== '0' ? 'checked' : ''}>🏷️ Imprimir etiqueta ao salvar</label>`}
  ${id ? '' : `<label style="display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-weight:600;cursor:pointer"><input type="checkbox" id="fwa" style="width:auto;margin:0" ${localStorage.getItem('sap_wa') !== '0' ? 'checked' : ''}>📲 Enviar comprovante ao cliente no WhatsApp ao salvar</label>
  <div class="hint" style="margin-bottom:8px">Vai o nº da OS, o que foi deixado, o prazo e o valor (pago, sinal ou a pagar).</div>`}
  <button class="b" onclick="salvarOS(${id||0})">${id ? 'Salvar alterações' : 'Salvar OS'}</button>
  <button class="b sec" onclick="fechar()">Cancelar</button>`);
  renderPares(); somaPares();
  if(id) renderPags();
}

/* ---- pagamentos editáveis (só na edição da OS) ---- */
let PAGS = [];
function renderPags(){
  const box = document.getElementById('pags'); if(!box) return;
  box.innerHTML = PAGS.map((p,i) => `<div class="pgl">
    <div class="row3">
      <div><label>Data</label><input type="date" value="${p.dia}" onchange="PAGS[${i}].dia=this.value"></div>
      <div><label>Valor (R$)</label><input type="number" min="0" step="0.01" inputmode="decimal" value="${p.valor}" oninput="PAGS[${i}].valor=this.value;atuPag()"></div>
      <div><label>Forma</label><select onchange="PAGS[${i}].forma=this.value">${optForma(p.forma)}</select></div>
    </div>
    <button type="button" class="b er sm" style="margin:0 0 8px" onclick="pagDel(${i})">Remover este pagamento</button>
  </div>`).join('') || '<div class="hint" style="margin-bottom:6px">Nenhum pagamento registrado nesta OS.</div>';
  atuPag();
}
function pagAdd(){ PAGS.push({ data:'', dia:hoje(), valor:'', forma:'Pix' }); renderPags();
  const i = document.querySelectorAll('#pags .pgl input[type=number]'); if(i.length) i[i.length-1].focus(); }
function pagDel(i){
  const p = PAGS[i]; if(+p.valor > 0 && !confirm(`Remover o pagamento de ${R(p.valor)} (${p.forma})?`)) return;
  PAGS.splice(i, 1); renderPags();
}
/* Mostra Valor · Desconto · Já pago · Falta (edição) ou atualiza o resumo da OS nova. */
function atuPag(){
  if(document.getElementById('pgr')) pgSel();
  const box = document.getElementById('pgr2'); if(!box) return;
  const val = +document.getElementById('fv').value || 0, ds = +document.getElementById('fds').value || 0;
  const pg = PAGS.reduce((t,p) => t + (+p.valor > 0 ? +p.valor : 0), 0), falta = val - ds - pg;
  box.innerHTML = `<div><small>Valor</small><b>${R(val)}</b></div><div><small>Desconto</small><b>${R(ds)}</b></div>
    <div class="ok"><small>Já pago</small><b>${R(pg)}</b></div><div class="${falta > 0.009 ? 'am' : 'ok'}"><small>Falta pagar</small><b>${R(Math.max(0, falta))}</b></div>
    ${falta < -0.009 ? `<div class="msg er">Atenção: os pagamentos passam o valor em ${R(-falta)}.</div>` : falta <= 0.009 && val > 0 ? '<div class="msg">OS quitada ✅</div>' : ''}`;
}

function salvarOS(id){
  const n   = +document.getElementById('fn').value;
  const tel = document.getElementById('ft').value.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'').replace(/^0+/,'');
  const cli = document.getElementById('fc').value.trim();
  const pares = PARES.map(p => { const x = { fazer:(p.fazer||'').trim(), horas:+p.horas || +C().tempoPar || 1 };
    if(+p.valor > 0) x.valor = Math.round(+p.valor * 100) / 100;
    if(p.entregue) x.entregue = p.entregue; return x; });
  const vazio = pares.findIndex(p => !p.fazer);
  const it  = pares.map(p => p.fazer.replace(/\s*\n\s*/g, ' + ')).join(' | ');
  const fe  = document.getElementById('fe').value;
  const fp  = document.getElementById('fp').value;
  const un  = (document.querySelector('input[name=fu]:checked') || {}).value || uDef();

  if(!cli) return alert('Preencha o nome do cliente.');
  if(vazio >= 0){ PAR_ATIVO = vazio; renderPares(); return alert(`Descreva o que fazer no par ${vazio+1}.`); }
  if(tel.length < 10 || tel.length > 11) return alert('Telefone inválido. Use DDD + número, ex.: (11) 99999-9999.');
  if(!(n > 0)) return alert('Informe um número de OS válido.');
  if(S.os.some(x => x.numero === n && x.id !== id && x.unidade === un)) return alert('Já existe uma OS com esse número nesta unidade.');
  if(fp && fe && fp < fe) return alert('O prazo não pode ser anterior à data de entrada.');

  const dados = {
    unidade:un, numero:n, cliente:cli, telefone:document.getElementById('ft').value.trim(),
    entrada:fe, prazo:fp, item:it,
    pares, legado:false,
    valor:+document.getElementById('fv').value || 0,
    prioridade:document.getElementById('fpr').value,
    responsavel:document.getElementById('fr').value.trim(),
    obs:document.getElementById('fo').value.trim()
  };
  const querEtq = !id && !!(document.getElementById('fetq') || {}).checked;
  const querWa = !id && !!(document.getElementById('fwa') || {}).checked;
  const idNovo = Date.now();

  if(id){
    const o = get(id);
    if(PAGS.some(p => !(+p.valor > 0))) return alert('Há um pagamento sem valor. Preencha o valor ou remova a linha.');
    const pags = PAGS.map(p => ({ data: p.data && diaDe(p.data) === p.dia ? p.data : new Date((p.dia || hoje()) + 'T12:00').toISOString(),
      valor:Math.round(+p.valor * 100) / 100, forma:p.forma }));
    const desc = Math.max(0, +document.getElementById('fds').value || 0);
    const st = document.getElementById('fst').value;
    const pg = pags.reduce((t,p) => t + p.valor, 0);
    if(pg > dados.valor - desc + 0.009 && !confirm(`Os pagamentos (${R(pg)}) passam o valor da OS (${R(dados.valor - desc)}). Salvar mesmo assim?`)) return;
    // o que mudou, para ficar registrado no histórico
    const mud = [];
    if((+o.valor||0) !== dados.valor) mud.push(`valor ${R(o.valor)} → ${R(dados.valor)}`);
    if((+o.desconto||0) !== desc) mud.push(`desconto ${R(o.desconto||0)} → ${R(desc)}`);
    if(Math.abs(pago(o) - pg) > 0.009) mud.push(`pago ${R(pago(o))} → ${R(pg)}`);
    else if(JSON.stringify(o.pagamentos||[]) !== JSON.stringify(pags)) mud.push('pagamentos corrigidos');
    if((o.item||'') !== it) mud.push('serviço alterado');
    if(o.numero !== n) mud.push(`nº ${o.numero} → ${n}`);
    if(o.unidade !== un) mud.push(`unidade ${UN(o.unidade).curto} → ${UN(un).curto}`);
    if(o.prazo !== fp) mud.push(`prazo ${fd(o.prazo)} → ${fd(fp)}`);
    Object.assign(o, dados, { desconto:desc, pagamentos:pags });
    o.historico.push({ data:agora(), de:o.status, para:o.status, nota:'OS editada' + (mud.length ? ': ' + mud.join('; ') : '') });
    if(st !== o.status){ o.historico.push({ data:agora(), de:o.status, para:st, nota:'Status alterado na edição' }); o.status = st; }
    if(o.status === 'Entregue') o.pares.forEach(p => { if(!p.entregue) p.entregue = agora(); });
    if(saldo(o) <= 0.009) o.promessa = '';
  } else {
    // Pagamento informado na abertura da OS: nada, uma parte (sinal) ou tudo
    const tp = (document.querySelector('input[name=pgt]:checked') || {}).value || 'nenhum';
    const forma = document.getElementById('fef').value;
    const pags = [], hist = [{ data:agora(), de:'', para:'Em fila', nota:'OS criada' }];
    const orc = ORC_DE ? getOrc(ORC_DE) : null;
    if(orc) hist[0].nota = `OS criada a partir do orçamento ${orc.numero}`;
    if(tp === 'entrada'){
      const v = +document.getElementById('fev').value;
      if(!(v > 0)) return alert('Informe quanto o cliente pagou agora.');
      if(dados.valor > 0 && v > dados.valor) return alert('O valor pago não pode ser maior que o valor total. Se pagou tudo, escolha "Pagou tudo".');
      pags.push({ data:agora(), valor:v, forma });
      hist.push({ data:agora(), de:'Em fila', para:'Em fila', nota:`Entrada (sinal) de ${R(v)} (${forma})` });
    }
    if(tp === 'total'){
      if(!(dados.valor > 0)) return alert('Informe o valor da OS para registrar o pagamento total.');
      pags.push({ data:agora(), valor:dados.valor, forma });
      hist.push({ data:agora(), de:'Em fila', para:'Em fila', nota:`Pagamento total de ${R(dados.valor)} (${forma})` });
    }
    localStorage.setItem('sap_etq', querEtq ? '1' : '0'); localStorage.setItem('sap_wa', querWa ? '1' : '0');
    S.os.push(Object.assign({ id:idNovo, status:'Em fila', criada:agora(),
      desconto:0, pagamentos:pags, avisos:[], historico:hist }, orc ? { orcId:orc.id } : {}, dados));
    if(n >= UN(un).proxNumero) UN(un).proxNumero = n + 1;   // a sequência da unidade continua a partir daqui
    localStorage.setItem('sap_uf', un);
    if(orc){ orc.status = 'aprovado'; orc.decidido = agora(); orc.osId = idNovo; orc.motivo = ''; }
    ORC_DE = 0;
  }
  save(); fechar(); render();
  if(!id){
    // Com etiqueta: imprime primeiro e, ao terminar, oferece o WhatsApp (o navegador só abre o
    // WhatsApp a partir de um toque do usuário). Sem etiqueta: abre o WhatsApp direto.
    if(querEtq) imprimirEtiqueta(idNovo, null, querWa ? () => setTimeout(() => confirmarWA(idNovo), 300) : null);
    else if(querWa) avisar(idNovo, 'recebido');
  }
}
function confirmarWA(id){
  const o = get(id); if(!o) return;
  modal(`
  <h3>OS #${o.numero} salva</h3>
  <div class="hint" style="margin-bottom:8px">Enviar o comprovante ao cliente no WhatsApp? Ele fica com a OS, o que foi deixado, o prazo e a situação do pagamento.</div>
  <div class="card" style="background:#f7f4f1;margin:0 0 10px;font-size:13.5px">${h(montar(o, 'recebido')).replace(/\n/g, '<br>')}</div>
  <button class="b wa" onclick="avisar(${id},'recebido');fechar()">📲 Enviar no WhatsApp</button>
  <button class="b sec" onclick="fechar()">Agora não</button>`);
}

/* ================= 14. IMPRESSÃO (via cliente + via produção) ======== */
function imprimir(id){
  limparEtiqueta();
  const o = get(id);
  const linha = (r,v) => `<p><b>${r}:</b> ${h(v||'—')}</p>`;
  const via = t => {
    const prod = t.includes('produção');
    return `<div class="via">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><img src="${LOGO}" style="height:50px;background:#1e1c1b;border-radius:6px"><h2 style="margin:0">${h(C().loja)} · ${h(unid(o).curto)} — ${t}</h2></div>
      <h3>Ordem de Serviço nº ${o.numero}</h3>
      ${linha('Cliente', o.cliente)}${linha('Telefone', o.telefone)}
      ${(o.pares||[]).map((p,i) => linha((o.pares.length>1 ? 'Par ' + (i+1) + ' – ' : '') + 'O que fazer', (p.fazer||'').replace(/\n/g, ' + ') + (!prod && +p.valor > 0 ? ' — ' + R(p.valor) : ''))).join('')}
      ${linha('Entrada', fd(o.entrada))}${linha('Prazo prometido', fd(o.prazo))}
      ${linha('Prioridade', o.prioridade.toUpperCase())}
      ${prod
        ? linha('Responsável', o.responsavel) + linha('Status', o.status)
        : linha('Valor', R(o.valor)) + linha('Desconto', R(o.desconto||0)) + linha('Pago', R(pago(o))) + linha('Saldo', R(saldo(o))) + linha('Situação do pagamento', saldo(o) <= 0.009 ? 'PAGO' : (pago(o) > 0 ? 'ENTRADA PAGA' : 'PAGAR NA RETIRADA'))}
      ${linha('Observações', o.obs)}
      ${prod ? '' : `<p><b>Retirada:</b> ${h(unid(o).horario)}</p>
        <p style="margin-top:14px">Assinatura do cliente: ______________________________</p>`}
      <p style="font-size:11px;color:#555">Emitido em ${fdt(agora())}</p>
    </div>`;
  };
  document.getElementById('print').innerHTML = via('Via do cliente') + via('Via da produção');
  fechar();
  setTimeout(() => window.print(), 60);
}

/* ================= 14C. ETIQUETA 5×4 cm (adesivo para o calçado) ========
   Uma etiqueta por PAR. Mostra só: nº da OS (grande), o que fazer naquele par
   e o prazo de entrega. Se a OS tem vários pares, mostra também "1/3".
   Tamanho por unidade: o Aventureiro tem impressora de 5×3 cm; as demais, 5×4 cm. */
const ETQ_TAM = { aventureiro: { h:30, txt:'5×3 cm', cls:' e30' } };
const tamEtq  = o => ETQ_TAM[o.unidade] || { h:40, txt:'5×4 cm', cls:'' };
/* Sigla da unidade no canto da etiqueta, para saber de qual loja é o calçado. */
const ETQ_SIGLA = { sams:"Sam's", aventureiro:'Avt' };
const siglaEtq = o => ETQ_SIGLA[o.unidade] || unid(o).curto || '';
function htmlEtiqueta(o, i){
  const ps = o.pares || [], p = ps[i] || { fazer:'' };
  const prazo = o.prazo ? fd(o.prazo).slice(0,5) : '—';
  const linhas = (p.fazer||'').split(/\n+/).map(x => x.trim()).filter(Boolean);
  const servs = linhas.length ? linhas.map(x => `<div class="s">${h(x)}</div>`).join('') : '<div class="s">—</div>';
  return `<div class="etq${tamEtq(o).cls}">
    <div class="etq-top"><span class="etq-os"><small>OS</small>${h(o.numero)}</span>${ps.length>1 ? `<span class="etq-par">${i+1}/${ps.length}</span>` : ''}</div>
    <div class="etq-mid">${servs}</div>
    <div class="etq-bot"><span>Prazo: ${prazo}</span><span>${h(siglaEtq(o))}</span></div>
  </div>`;
}
/* Monta fora da tela e diminui a letra até caber na altura da etiqueta. */
function etiquetaPronta(o, i){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:-10000px;top:0;visibility:hidden';
  t.innerHTML = htmlEtiqueta(o, i);
  document.body.appendChild(t);
  const mid = t.querySelector('.etq-mid');
  const cabeAgora = () => mid.scrollHeight <= mid.clientHeight + 1;
  const reduzir = (ini, min) => { let fs = ini; mid.style.setProperty('--fs', fs + 'pt');
    while(!cabeAgora() && fs > min){ fs -= .5; mid.style.setProperty('--fs', fs + 'pt'); } };
  const baixa = tamEtq(o).h < 40;
  reduzir(baixa ? 12 : 16, baixa ? 7 : 8);          // 1º: uma tarefa por linha
  if(!cabeAgora()){ mid.classList.add('inl'); reduzir(baixa ? 9 : 11, 6); }   // 2º: tarefas lado a lado
  const cabe = cabeAgora();
  const html = t.innerHTML;
  t.remove();
  return { html, cabe };
}
function limparEtiqueta(){
  const st = document.getElementById('etq-page'); if(st) st.remove();
  document.body.classList.remove('etq-mode');
}
/* Sem idx: imprime uma etiqueta para CADA par da OS. Com idx: só aquele par.
   Aventureiro usa a Niimbot B1 (Bluetooth): vai para a tela da Niimbot, a não ser
   que peçam a impressão pelo navegador (navegador = true). */
function imprimirEtiqueta(id, idx, depois, navegador){
  const o = get(id); if(!o) return;
  const idxs = idx == null ? (o.pares||[]).map((_, i) => i) : [idx];
  if(!idxs.length) return alert('Esta OS não tem nenhum par cadastrado.');
  if(ETQ_NIIMBOT[o.unidade] && !navegador) return niimbotEtiqueta(id, idx, idxs, depois);
  const rs = idxs.map(i => etiquetaPronta(o, i));
  if(rs.some(r => !r.cabe) && !confirm('O texto de alguma etiqueta não cabe inteiro nos '+tamEtq(o).txt+' e será cortado. Imprimir mesmo assim?')) return;
  document.getElementById('print').innerHTML = rs.map(r => r.html).join('');
  const st = document.createElement('style');           // tamanho de página só durante a etiqueta
  st.id = 'etq-page';
  st.textContent = '@page{size:50mm '+tamEtq(o).h+'mm;margin:0}';
  document.head.appendChild(st);
  document.body.classList.add('etq-mode');
  fechar();
  window.addEventListener('afterprint', limparEtiqueta, { once:true });
  if(typeof depois === 'function') window.addEventListener('afterprint', depois, { once:true });
  setTimeout(() => window.print(), 60);
}

/* ================= 14D. ETIQUETA NA NIIMBOT B1 (Bluetooth, Aventureiro) ====
   A Niimbot não aparece como impressora do sistema: o Chrome (Android/PC) conversa
   com ela direto pelo Bluetooth usando a biblioteca aberta niimbluelib (vendor/).
   A etiqueta é desenhada num canvas em preto e branco puro, 8 pontos por mm (203 dpi).
   Não funciona no iPhone (o Safari não libera Bluetooth para sites). */
const ETQ_NIIMBOT = { aventureiro: true };
const NB_W = 384, NB_H = 240;          // cabeça da B1 = 48 mm; etiqueta 5×3 cm = 30 mm de altura
/* Na B1 a imagem sai ~4 mm deslocada para a direita na etiqueta (medido na impressão real).
   Por isso o conteúdo fica entre NB_L e NB_R do canvas, o que deixa ele centralizado no papel. */
const NB_L = 4, NB_R = 332;
const NB = { cli:null, fila:null, ocupado:false };

function carregarNiimbot(){
  if(window.niimbluelib) return Promise.resolve(window.niimbluelib);
  return new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = 'vendor/niimbluelib-0.47.1.min.js';
    s.onload = () => window.niimbluelib ? ok(window.niimbluelib) : erro(new Error('módulo da Niimbot inválido'));
    s.onerror = () => { s.remove(); erro(new Error('não foi possível carregar o módulo da Niimbot (verifique a internet)')); };
    document.head.appendChild(s);
  });
}

/* Mesma etiqueta do 5×3 cm (OS, par, tarefas, prazo), desenhada em pixels. */
function canvasEtiqueta(o, i){
  const ps = o.pares || [], p = ps[i] || { fazer:'' };
  const c = document.createElement('canvas'); c.width = NB_W; c.height = NB_H;
  const g = c.getContext('2d'), F = 'Arial, Helvetica, sans-serif', L = NB_L, R = NB_R;
  g.fillStyle = '#fff'; g.fillRect(0, 0, NB_W, NB_H); g.fillStyle = '#000'; g.strokeStyle = '#000';
  // topo: nº da OS e "1/3"
  g.font = `700 18px ${F}`; g.fillText('OS', L, 48);
  g.font = `900 46px ${F}`; g.fillText(String(o.numero), L + 30, 48);
  if(ps.length > 1){
    const t = `${i+1}/${ps.length}`; g.font = `900 26px ${F}`;
    const w = g.measureText(t).width + 12; g.lineWidth = 3;
    g.strokeRect(R - w, 16, w, 32); g.fillText(t, R - w + 6, 41);
  }
  g.fillRect(L, 56, R - L, 3);
  // rodapé: prazo
  g.fillRect(L, NB_H - 44, R - L, 3);
  g.font = `900 28px ${F}`; g.fillText('Prazo: ' + (o.prazo ? fd(o.prazo).slice(0,5) : '—'), L, NB_H - 14);
  g.textAlign = 'right'; g.fillText(siglaEtq(o), R, NB_H - 14); g.textAlign = 'left';
  // meio: tarefas em maiúsculas, a letra diminui até caber
  const topo = 64, alt = NB_H - 48 - topo, larg = R - L;
  const tarefas = (p.fazer||'').split(/\n+/).map(x => x.trim().toUpperCase()).filter(Boolean);
  if(!tarefas.length) tarefas.push('—');
  const quebrar = (txt, fs) => {                   // quebra em linhas que cabem na largura
    g.font = `800 ${fs}px ${F}`;
    const out = []; let lin = '';
    txt.split(/\s+/).forEach(pal => {
      while(g.measureText(pal).width > larg){      // palavra maior que a linha: corta
        let k = pal.length; while(k > 1 && g.measureText(pal.slice(0, k)).width > larg) k--;
        if(lin){ out.push(lin); lin = ''; }
        out.push(pal.slice(0, k)); pal = pal.slice(k);
      }
      const t = lin ? lin + ' ' + pal : pal;
      if(g.measureText(t).width <= larg) lin = t; else { out.push(lin); lin = pal; }
    });
    if(lin) out.push(lin);
    return out;
  };
  const montar = (fs, junto) => (junto ? [tarefas.join(' · ')] : tarefas).flatMap(t => quebrar(t, fs));
  let fs = 34, junto = false, linhas = montar(fs, junto);
  const cabeAgora = () => linhas.length * Math.round(fs * 1.12) <= alt;
  while(!cabeAgora() && fs > 20){ fs--; linhas = montar(fs, junto); }               // 1º: uma tarefa por linha
  if(!cabeAgora()){ junto = true; fs = 26; linhas = montar(fs, junto);              // 2º: tarefas lado a lado
    while(!cabeAgora() && fs > 16){ fs--; linhas = montar(fs, junto); } }
  const cabe = cabeAgora(), lh = Math.round(fs * 1.12);
  g.save(); g.beginPath(); g.rect(0, topo, NB_W, alt); g.clip();
  g.font = `800 ${fs}px ${F}`;
  linhas.forEach((t, k) => g.fillText(t, L, topo + fs * .9 + k * lh));
  g.restore();
  // preto e branco puro (a impressora só entende pontos pretos ou brancos)
  const im = g.getImageData(0, 0, NB_W, NB_H), d = im.data;
  for(let k = 0; k < d.length; k += 4){
    const v = (d[k]*.3 + d[k+1]*.59 + d[k+2]*.11) < 150 ? 0 : 255;
    d[k] = d[k+1] = d[k+2] = v; d[k+3] = 255;
  }
  g.putImageData(im, 0, 0);
  return { canvas:c, cabe };
}

function niimbotEtiqueta(id, idx, idxs, depois){
  const o = get(id); if(!o) return;
  const rs = idxs.map(i => canvasEtiqueta(o, i));
  NB.fila = { id, idx, rs, depois };
  const ligada = NB.cli && NB.cli.isConnected();
  modal(`
  <h3>🏷️ ${rs.length > 1 ? rs.length + ' etiquetas' : 'Etiqueta'} da OS #${h(o.numero)}</h3>
  <div class="hint">Impressora Niimbot B1 · etiqueta 5×3 cm</div>
  <div id="nbprev" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0"></div>
  ${rs.some(r => !r.cabe) ? '<div class="hint" style="color:var(--er);margin-bottom:6px">O texto de alguma etiqueta não coube inteiro e vai sair cortado.</div>' : ''}
  <div id="nbst" class="hint" style="min-height:1.4em;margin-bottom:8px">${ligada ? 'Impressora conectada.' : 'Ligue a impressora e o Bluetooth do celular. Na primeira vez o Chrome pede para escolher a impressora na lista.'}</div>
  <button class="b" id="nbbt" onclick="niimbotImprimir()">🖨️ Imprimir na Niimbot</button>
  <button class="b sec" onclick="niimbotNavegador()">Imprimir pelo navegador</button>
  <button class="b sec" onclick="niimbotFechar()">Fechar</button>`);
  const pv = document.getElementById('nbprev');
  rs.forEach(r => { r.canvas.style.cssText = 'width:160px;height:auto;border:1px solid #ccc;border-radius:4px;background:#fff'; pv.appendChild(r.canvas); });
}
function niimbotFechar(){
  if(NB.ocupado) return;
  const f = NB.fila; NB.fila = null; fechar();
  if(f && typeof f.depois === 'function') f.depois();
}
function niimbotNavegador(){
  if(NB.ocupado) return;
  const f = NB.fila; NB.fila = null; if(!f) return;
  imprimirEtiqueta(f.id, f.idx, f.depois, true);
}
async function niimbotImprimir(){
  const f = NB.fila; if(!f || NB.ocupado) return;
  const st = document.getElementById('nbst'), bt = document.getElementById('nbbt');
  const msg = t => { if(st) st.textContent = t; };
  if(!navigator.bluetooth) return msg('Este navegador não deixa sites usarem o Bluetooth. Use o Google Chrome no Android (no iPhone não funciona).');
  NB.ocupado = true; if(bt) bt.disabled = true;
  let task = null, ok = false;
  try{
    msg('Conectando à impressora…');
    const nb = await carregarNiimbot();
    if(!NB.cli) NB.cli = new nb.NiimbotBluetoothClient();
    if(!NB.cli.isConnected()) await NB.cli.connect();
    task = NB.cli.protocol.newPrintTask(NB.cli.getPrintTaskType() || 'B1',
      { totalPages:f.rs.length, density:3, labelType:nb.LabelType.WithGaps });
    await task.printInit();
    for(let k = 0; k < f.rs.length; k++){
      msg(f.rs.length > 1 ? `Imprimindo etiqueta ${k+1} de ${f.rs.length}…` : 'Imprimindo…');
      await task.printPage(nb.ImageEncoder.encodeCanvas(f.rs[k].canvas, nb.PageColorType.SingleColor, 'top'), 1);
      await task.waitForPageFinished();
    }
    await task.waitForFinished();
    ok = true;
  }catch(e){
    const t = String((e && e.message) || e);
    msg(/cancel|chosen|selected/i.test(t) ? 'Nenhuma impressora escolhida. Toque em "Imprimir na Niimbot" de novo e escolha a B1 na lista.'
                                         : 'Não consegui imprimir: ' + t + '. Confira se a impressora está ligada e com etiqueta, e tente de novo.');
  }finally{
    if(task) try{ await task.printEnd(); }catch(_){}
    NB.ocupado = false; if(bt) bt.disabled = false;
  }
  if(ok && NB.fila === f){ msg('Pronto!'); setTimeout(() => { if(NB.fila === f) niimbotFechar(); }, 700); }
}

/* ============ 14B. PAGAMENTO NA ABERTURA DA OS (apoio do formulário) ===== */
/* Troca de unidade no formulário: sugere o próximo número daquela unidade (só em OS nova). */
function unSel(){
  const v = document.querySelector('input[name=fu]:checked').value;
  document.querySelectorAll('#pu label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  if(document.getElementById('pu').dataset.new) document.getElementById('fn').value = UN(v).proxNumero;
}
function pgSel(){
  const t = (document.querySelector('input[name=pgt]:checked') || {}).value || 'nenhum';
  document.querySelectorAll('#pg label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  document.getElementById('pgx').style.display = t === 'nenhum' ? 'none' : 'block';
  document.getElementById('pgv').style.display = t === 'entrada' ? 'block' : 'none';
  const val = +document.getElementById('fv').value || 0, ent = +document.getElementById('fev').value || 0;
  const q = document.getElementById('pgq');
  q.innerHTML = t === 'entrada' && val > 0 ? [50, 30].map(p =>
    `<button type="button" class="b sec sm" onclick="document.getElementById('fev').value='${(val * p / 100).toFixed(2)}';pgSel()">${p}% = ${R(val * p / 100)}</button>`).join('') : '';
  const agoraPg = t === 'total' ? val : t === 'entrada' ? ent : 0, falta = val - agoraPg;
  document.getElementById('pgr').innerHTML =
    `<div><small>Total do serviço</small><b>${val > 0 ? R(val) : 'a combinar'}</b></div>
     <div class="ok"><small>Pago agora</small><b>${R(agoraPg)}</b></div>
     <div class="${falta > 0.009 ? 'am' : 'ok'}"><small>Falta pagar na retirada</small><b>${R(Math.max(0, falta))}</b></div>
     ${falta < -0.009 ? `<div class="msg er">O valor pago passa o total em ${R(-falta)}.</div>` : ''}`;
}

/* ============ 14C. RELACIONAMENTO COM CLIENTES ==========================
   Agrupa as OS por telefone e mostra: inativos (sumiram), esfriando,
   pós-venda (entregues há poucos dias) e clientes fiéis. Cada contato é
   registrado para não incomodar o cliente com lembretes repetidos. */
let G = { f:'inativos', q:'' };
const chaveFone = t => String(t||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'').replace(/^0+/,'');
const entregueEm = o => { const e = [...(o.historico||[])].reverse().find(x => x.para === 'Entregue'); return e ? e.data : null; };
const ultContato = (c, tipo) => (S.contatos[c.fone] || []).filter(x => x.tipo === tipo).slice(-1)[0];

function listaClientes(){
  const m = {};
  S.os.filter(o => o.status !== 'Cancelado').forEach(o => {
    const k = chaveFone(o.telefone); if(!k) return;
    const c = m[k] = m[k] || { fone:k, os:[], gasto:0 };
    c.os.push(o); c.gasto += pago(o);
  });
  return Object.values(m).map(c => {
    c.os.sort((a,b) => (a.entrada||'').localeCompare(b.entrada||'') || a.numero - b.numero);
    c.ultima = c.os[c.os.length - 1];
    c.nome = c.ultima.cliente; c.telefone = c.ultima.telefone;
    c.dias = diasEntre(c.ultima.entrada + 'T12:00', hoje() + 'T12:00');
    c.abertas = c.os.filter(o => aberta(o) || o.status === 'Pronto').length;   // ainda tem trabalho com a loja
    return c;
  });
}
function inativos(){
  return listaClientes().filter(c => !c.abertas && c.dias >= C().diasRetorno &&
    (!ultContato(c,'retorno') || diasEntre(ultContato(c,'retorno').data, agora()) >= 30));
}
function posVendas(){
  return listaClientes().filter(c => {
    const o = c.ultima; if(o.status !== 'Entregue') return false;
    const e = entregueEm(o); if(!e) return false;
    const d = diasEntre(e, agora()), pv = ultContato(c,'posvenda');
    return d >= 2 && d <= 10 && (!pv || pv.data < e);
  });
}
function segCli(f){
  const l = listaClientes();
  if(f === 'inativos') return inativos().sort((a,b) => b.dias - a.dias);
  if(f === 'esfriando') return l.filter(c => !c.abertas && c.dias >= Math.floor(C().diasRetorno/2) && c.dias < C().diasRetorno).sort((a,b) => b.dias - a.dias);
  if(f === 'posvenda') return posVendas();
  if(f === 'vip') return l.filter(c => c.os.length >= 4).sort((a,b) => b.gasto - a.gasto);
  return l.sort((a,b) => a.nome.localeCompare(b.nome));
}
function vCli(){
  const segs = [['inativos','😴 Inativos'],['esfriando','⏳ Esfriando'],['posvenda','💌 Pós-venda'],['vip','⭐ Fiéis'],['todos','👥 Todos']];
  $app.innerHTML = `
  <div class="card"><h3>Relacionamento com clientes</h3>
    <div class="hint"><b>Inativos</b>: sem OS há ${C().diasRetorno}+ dias. <b>Esfriando</b>: na metade desse prazo, hora de se lembrar deles. <b>Pós-venda</b>: entregues há 2 a 10 dias — pergunte se ficou tudo certo. <b>Fiéis</b>: 4 ou mais OS. Depois de lembrar, o cliente sai da lista de inativos por 30 dias.</div>
  </div>
  <div class="seg" style="margin-bottom:8px">${segs.map(([k,t]) =>
    `<button class="b ${G.f===k?'':'sec'} sm" onclick="G.f='${k}';vCli()">${t} (${segCli(k).length})</button>`).join('')}</div>
  <div class="card"><input placeholder="Buscar cliente ou telefone" value="${h(G.q)}" oninput="G.q=this.value;vCliLista()"></div>
  <div id="listaCli"></div>`;
  vCliLista();
}
function vCliLista(){
  const q = G.q.trim().toLowerCase(), qd = G.q.replace(/\D/g,'');
  const l = segCli(G.f).filter(c => !q || c.nome.toLowerCase().includes(q) || (qd.length >= 3 && c.fone.includes(qd)));
  document.getElementById('listaCli').innerHTML = l.map(c => {
    const tipo = G.f === 'posvenda' ? 'posvenda' : 'retorno';
    const lr = ultContato(c,'retorno');
    return `<div class="card os fade ${c.dias >= C().diasRetorno && !c.abertas ? 'atr' : ''}">
      <b>${h(c.nome)}</b>
      ${unTag(c.ultima.unidade)}${c.os.length >= 4 ? '<span class="tag ok">⭐ FIEL</span>' : ''}
      ${c.abertas ? '<span class="tag am">OS EM ANDAMENTO</span>' : ''}
      ${lr ? `<span class="tag">Lembrado há ${diasEntre(lr.data, agora())}d</span>` : ''}
      <div class="hint">${h(c.telefone)}<br>
        Última visita ${fd(c.ultima.entrada)} · <b>${c.dias} dias</b> · último item: ${h(c.ultima.item)}<br>
        ${c.os.length} OS · pagou ${R(c.gasto)}</div>
      <button class="b wa" onclick="enviarCli('${c.fone}','${tipo}')">📲 ${tipo === 'posvenda' ? 'Pós-venda' : 'Convidar a voltar'}</button>
      <button class="b sec" onclick="novaOSCli('${c.fone}')">+ Nova OS</button>
      <button class="b sec" onclick="F.q='${c.fone}';F.st='';F.f='';ir('os')">Ver OS</button>
    </div>`;
  }).join('') || '<div class="card hint">Nenhum cliente nesta lista por enquanto ✅</div>';
}
function enviarCli(fone, tipo){
  const c = listaClientes().find(x => x.fone === fone); if(!c) return;
  const v = { nome:(c.nome||'').trim().split(/\s+/)[0], item:itemMsg(c.ultima), numero:c.ultima.numero,
              loja:C().loja + ' – ' + UN(c.ultima.unidade).curto, unidade:UN(c.ultima.unidade).curto,
              horario:UN(c.ultima.unidade).horario, dias:c.dias };
  const texto = (C().msgs[tipo] || '').replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
  if(Canal.enviar({ telefone:c.telefone }, tipo, texto)){
    (S.contatos[fone] = S.contatos[fone] || []).push({ data:agora(), tipo });
    c.ultima.historico.push({ data:agora(), de:c.ultima.status, para:c.ultima.status,
      nota:`Cliente contatado no WhatsApp (${tipo === 'posvenda' ? 'pós-venda' : 'convite para voltar'})` });
    save(); render();
  }
}
function novaOSCli(fone){
  const c = listaClientes().find(x => x.fone === fone); if(!c) return;
  formOS();
  document.getElementById('fc').value = c.nome;
  document.getElementById('ft').value = c.telefone;
}

      `<label>${MSG_NOME[k] || k}</label><textarea class="mg" data-k="${k}">${h(v)}</textarea>`).join('')}

    <button class="b" onclick="backup()">⬇️ Baixar backup (.json)</button>

    <input type="file" accept=".json,application/json" onchange="restaurar(this.files[0])">
    <div class="sep"></div>
    <button class="b er" onclick="zerar()">Apagar todos os dados</button>
    <div class="hint" style="margin-top:6px">Os dados ficam salvos no navegador deste aparelho. Faça backup antes de limpar o histórico do navegador.</div>
  </div>`;
}
function salvarCfg(){
  const c = C();
  c.loja = document.getElementById('cl').value.trim() || 'Sapataria';
  c.diasParado = +document.getElementById('cd').value || 7;
  c.diasRetorno = +document.getElementById('cr').value || 90;
  c.unidades.forEach((u,i) => {
    const g = k => document.getElementById('un_' + k + '_' + i);
    u.nome = g('nome').value.trim() || u.nome;
    u.curto = g('curto').value.trim() || u.curto;
    u.horario = g('hor').value.trim();
    const n = Math.max(1, +g('prox').value || 1);
    const mx = Math.max(0, ...S.os.filter(o => o.unidade === u.id).map(o => o.numero));
    u.proxNumero = n;
    if(mx >= n && !confirm(`${u.curto}: já existem OS até o nº ${mx}. Manter o próximo em ${n} pode repetir a numeração. Continuar?`))
      u.proxNumero = mx + 1;
  });
  document.querySelectorAll('.mg').forEach(i => c.msgs[i.dataset.k] = i.value);
  save(); render(); alert('Configurações salvas ✅');
}function backup(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)], {type:'application/json'}));
  a.download = `backup-sapataria-${hoje()}.json`;
  a.click();
}
function restaurar(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.os) || !d.config) throw 0;
      if(confirm('Substituir TODOS os dados atuais por este backup?')){
        S = d; S.contatos = S.contatos || {}; S.os = S.os || [];
        migrarMsgs(S.config);
        S.config = Object.assign({}, PADRAO.config, S.config);
        S.config.tempos = Object.assign({}, PADRAO.config.tempos, S.config.tempos || {});
        S.config.msgs   = Object.assign({}, PADRAO.config.msgs,   S.config.msgs   || {});
        migrar(); save(); render(); alert('Backup restaurado ✅');
      }
    } catch(e){ alert('Arquivo inválido ou corrompido.'); }
  };
  r.readAsText(f);
}
function zerar(){
  if(!confirm('Apagar TODAS as OS e voltar à configuração inicial?')) return;
  if(!confirm('Confirma mesmo? Esta ação não pode ser desfeita.')) return;
  S = JSON.parse(JSON.stringify(PADRAO)); migrar(); save(); render();
}

/* ============================ 15B. ORÇAMENTOS ==========================
   Orçamento é o que o cliente ainda NÃO aprovou: não entra na produção, não
   ocupa a fila e não conta no caixa. Cliente aprovou → "Dar entrada no
   serviço" abre a OS já preenchida. Cliente não quis → fica como "Não
   aprovado", com o motivo (para saber o que se perdeu). */
let OF = { f:'aberto', q:'' }, ORC_DE = 0;
const ORC_ST  = { aberto:'Aguardando resposta', aprovado:'Aprovado', recusado:'Não aprovado' };
const ORC_TAG = { aberto:'am', aprovado:'ok', recusado:'er' };
const MOTIVOS = ['Achou caro','Vai pensar','Não compensa consertar','Fez em outro lugar','Não respondeu'];
const orcU  = () => (S.orcamentos || []).filter(x => U === 'todas' || x.unidade === U);
const getOrc = id => (S.orcamentos || []).find(x => x.id === id);
const orcVencido = x => x.status === 'aberto' && x.validade && x.validade < hoje();
const proxOrc = () => (S.orcamentos || []).reduce((t,x) => Math.max(t, +x.numero || 0), 0) + 1;
const orcLista = x => { const ps = x.pares || [];
  return ps.map((p,i) => `${ps.length>1 ? `<b>Par ${i+1}:</b> ` : ''}${parTxt(p)}${+p.valor > 0 ? ` · <b>${R(p.valor)}</b>` : ''}`).join('<br>'); };

function segOrc(f){
  const l = orcU();
  return (f === 'todos' ? l : l.filter(x => x.status === f))
    .sort((a,b) => (b.data||'').localeCompare(a.data||'') || b.numero - a.numero);
}
function vOrc(){
  const l = orcU(), lim = addDia(hoje(), -30);
  const ab = l.filter(x => x.status === 'aberto');
  const dec = l.filter(x => x.status !== 'aberto' && (x.decidido || '').slice(0,10) >= lim);
  const apr = dec.filter(x => x.status === 'aprovado');
  const k = (n,t) => `<div class="card kpi"><b>${n}</b><small>${t}</small></div>`;
  const segs = [['aberto','⏳ Aguardando'],['aprovado','✅ Aprovados'],['recusado','❌ Não aprovados'],['todos','Todos']];
  $app.innerHTML = `
  <div class="card"><h3>Orçamentos</h3>
    <div class="hint" style="margin-bottom:10px">Faça o orçamento <b>sem abrir OS</b>. Se o cliente <b>aprovar</b>, toque em <b>Dar entrada no serviço</b> e a OS abre já preenchida. Se <b>não quiser</b>, marque como não aprovado: nada vai para a produção nem para o caixa.</div>
    <button class="b" onclick="formOrc()">+ Novo orçamento</button>
  </div>
  <div class="grid">
    ${k(ab.length,'Aguardando resposta')}
    ${k(R(ab.reduce((t,x) => t + (+x.valor||0), 0)),'Valor aguardando')}
    ${k(apr.length,'Aprovados (30 dias)')}
    ${k(dec.length ? Math.round(apr.length / dec.length * 100) + '%' : '—','Aprovação (30 dias)')}
  </div>
  <div class="seg" style="margin-bottom:8px">${segs.map(([f,t]) =>
    `<button class="b ${OF.f===f?'':'sec'} sm" onclick="OF.f='${f}';vOrc()">${t} (${segOrc(f).length})</button>`).join('')}</div>
  <div class="card"><input placeholder="Buscar por cliente, telefone ou nº do orçamento" value="${h(OF.q)}" oninput="OF.q=this.value;vOrcLista()" style="margin-bottom:0"></div>
  <div id="listaOrc"></div>`;
  vOrcLista();
}
function vOrcLista(){
  const q = OF.q.trim().toLowerCase(), qd = OF.q.replace(/\D/g,'');
  const l = segOrc(OF.f).filter(x => !q || (x.cliente||'').toLowerCase().includes(q) || String(x.numero) === q
    || (qd.length >= 3 && String(x.telefone||'').replace(/\D/g,'').includes(qd)));
  document.getElementById('listaOrc').innerHTML = l.map(cartaoOrc).join('')
    || '<div class="card hint">Nenhum orçamento nesta lista.</div>';
}
function cartaoOrc(x){
  const os = x.osId ? get(x.osId) : null;
  const env = (x.avisos || []).length;
  return `<div class="card os fade ${orcVencido(x) ? 'atr' : ''}">
    <b>Orçamento ${x.numero} · ${h(x.cliente)}</b> <span class="tag ${ORC_TAG[x.status]}">${ORC_ST[x.status]}</span><br>
    ${unTag(x.unidade)}${orcVencido(x) ? '<span class="tag er">VENCIDO</span>' : ''}${env ? '<span class="tag">ENVIADO</span>' : ''}
    <div class="hint" style="margin-top:6px">${h(x.telefone)} · feito em ${fd(x.data)}${x.validade ? ` · válido até ${fd(x.validade)}` : ''}<br>
      ${orcLista(x)}<br>Valor: <b>${+x.valor > 0 ? R(x.valor) : 'a combinar'}</b>
      ${x.status === 'recusado' ? `<br>Não aprovado em ${fd(diaDe(x.decidido))}${x.motivo ? ' · motivo: ' + h(x.motivo) : ''}` : ''}
      ${x.status === 'aprovado' ? `<br>Aprovado em ${fd(diaDe(x.decidido))}${os ? ` · virou a <b>OS #${os.numero}</b>` : ''}` : ''}</div>
    ${x.status === 'aberto' ? `
      <button class="b ok" onclick="aprovarOrc(${x.id})">✅ Cliente aprovou: dar entrada no serviço</button>
      <button class="b er" onclick="recusarOrc(${x.id})">❌ Cliente não quis</button>
      <button class="b wa" onclick="enviarOrc(${x.id})">📲 ${env ? 'Reenviar' : 'Enviar'} no WhatsApp</button>` : ''}
    ${os ? `<button class="b sec" onclick="detalhe(${os.id})">Ver OS #${os.numero}</button>` : ''}
    ${x.status === 'recusado' ? `<button class="b sec" onclick="reabrirOrc(${x.id})">↩️ Voltar para aguardando</button>` : ''}
    <button class="b sec" onclick="formOrc(${x.id})">✏️ Editar</button>
  </div>`;
}
function formOrc(id){
  const x = id ? getOrc(id) : { unidade:uDef(), numero:proxOrc(), data:hoje(), validade:addDia(hoje(), 15), pares:[], valor:'' };
  PARES = (x.pares||[]).map(p => ({ fazer:p.fazer||'', horas:+p.horas || +C().tempoPar || 1, valor:+p.valor > 0 ? +p.valor : '' }));
  if(!PARES.length) PARES = [{ fazer:'', horas:+C().tempoPar || 1, valor:'' }];
  PAR_ATIVO = 0;
  modal(`
  <h3>${id ? 'Editar orçamento ' + x.numero : 'Novo orçamento'}</h3>
  <div class="hint" style="margin-bottom:8px">O orçamento não entra na produção nem no caixa. Só vira serviço quando o cliente aprovar.</div>
  <div class="row">
    <div><label>Cliente</label><input id="fc" value="${h(x.cliente||'')}"></div>
    <div><label>Telefone com DDD</label><input id="ft" type="tel" inputmode="tel" placeholder="(11) 99999-9999" value="${h(x.telefone||'')}"></div>
  </div>
  <div class="row3">
    <div><label>Data</label><input id="od" type="date" value="${x.data}"></div>
    <div><label>Válido até</label><input id="ov" type="date" value="${x.validade||''}"></div>
    <div><label>Unidade</label><select id="ou">${optUn(x.unidade)}</select></div>
  </div>
  <label>O que fazer — um par por aba</label>
  <div id="pares"></div>
  <label>Valor total do orçamento (R$)</label>
  <input id="fv" type="number" step="0.01" inputmode="decimal" value="${x.valor}">
  <label>Observações</label><textarea id="fo">${h(x.obs||'')}</textarea>
  <button class="b" onclick="salvarOrc(${id||0})">Salvar orçamento</button>
  ${id ? '' : `<button class="b wa" onclick="salvarOrc(0, true)">Salvar e enviar no WhatsApp</button>`}
  <button class="b sec" onclick="fechar()">Cancelar</button>
  ${id ? `<button class="b er" onclick="excluirOrc(${id})">Excluir</button>` : ''}`);
  renderPares(); somaPares();
}
function salvarOrc(id, enviar){
  const cli = document.getElementById('fc').value.trim();
  const tel = document.getElementById('ft').value.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'').replace(/^0+/,'');
  const pares = PARES.map(p => { const z = { fazer:(p.fazer||'').trim(), horas:+p.horas || +C().tempoPar || 1 };
    if(+p.valor > 0) z.valor = Math.round(+p.valor * 100) / 100; return z; });
  const vazio = pares.findIndex(p => !p.fazer);
  if(!cli) return alert('Preencha o nome do cliente.');
  if(tel.length < 10 || tel.length > 11) return alert('Telefone inválido. Use DDD + número, ex.: (11) 99999-9999.');
  if(vazio >= 0){ PAR_ATIVO = vazio; renderPares(); return alert(`Descreva o que fazer no par ${vazio+1}.`); }
  const dados = { cliente:cli, telefone:document.getElementById('ft').value.trim(),
    data:document.getElementById('od').value || hoje(), validade:document.getElementById('ov').value || '',
    unidade:document.getElementById('ou').value, pares, valor:+document.getElementById('fv').value || 0,
    obs:document.getElementById('fo').value.trim() };
  let x;
  if(id){ x = getOrc(id); Object.assign(x, dados); }
  else {
    x = Object.assign({ id:Date.now(), numero:proxOrc(), status:'aberto', criada:agora(), avisos:[] }, dados);
    (S.orcamentos = S.orcamentos || []).push(x);
    localStorage.setItem('sap_uf', dados.unidade);
    OF.f = 'aberto';
  }
  save(); fechar(); render();
  if(enviar) enviarOrc(x.id);
}
function montarOrc(x){
  const ps = x.pares || [], u = UN(x.unidade);
  const v = { nome:(x.cliente||'').trim().split(/\s+/)[0] || '', numero:x.numero,
    servicos: ps.map((p,i) => (ps.length > 1 ? `• Par ${i+1}: ` : '• ') + String(p.fazer||'').replace(/\s*\n\s*/g, ' + ')
      + (ps.length > 1 && +p.valor > 0 ? ` — ${R(p.valor)}` : '')).join('\n'),
    valor: +x.valor > 0 ? R(x.valor) : 'a combinar', validade: x.validade ? fd(x.validade) : 'a combinar',
    loja:C().loja + ' – ' + u.curto, unidade:u.curto, horario:u.horario };
  return (C().msgs.proposta || '').replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
}
function enviarOrc(id){
  const x = getOrc(id); if(!x) return;
  if(Canal.enviar(x, 'proposta', montarOrc(x))){
    (x.avisos = x.avisos || []).push({ data:agora(), tipo:'proposta' });
    save(); render();
  }
}
/* Cliente aprovou: abre o formulário de OS já preenchido com o orçamento. */
function aprovarOrc(id){ formOS(0, id); }
function recusarOrc(id){
  const x = getOrc(id); if(!x) return;
  modal(`
  <h3>Orçamento ${x.numero} não aprovado</h3>
  <div class="hint" style="margin-bottom:8px">${h(x.cliente)} · ${+x.valor > 0 ? R(x.valor) : 'valor a combinar'}. Nada entra na produção nem no caixa.</div>
  <label>Por que o cliente não quis? (opcional)</label>
  <div class="seg" style="flex-wrap:wrap;margin:4px 0 8px">${MOTIVOS.map(m =>
    `<button type="button" class="b sec sm" onclick="document.getElementById('om').value='${m}'">${m}</button>`).join('')}</div>
  <input id="om" placeholder="ou escreva o motivo">
  <button class="b er" onclick="confirmarRecusa(${id})">Marcar como não aprovado</button>
  <button class="b sec" onclick="fechar()">Voltar</button>`);
}
function confirmarRecusa(id){
  const x = getOrc(id); if(!x) return;
  x.status = 'recusado'; x.motivo = document.getElementById('om').value.trim(); x.decidido = agora();
  save(); fechar(); render();
}
function reabrirOrc(id){
  const x = getOrc(id); if(!x) return;
  x.status = 'aberto'; x.motivo = ''; x.decidido = '';
  OF.f = 'aberto'; save(); render();
}
function excluirOrc(id){
  const x = getOrc(id); if(!x) return;
  if(!confirm(`Excluir o orçamento ${x.numero} de ${x.cliente}?`)) return;
  S.orcamentos = S.orcamentos.filter(z => z.id !== id);
  ((S.removidos = S.removidos || {}).orcamentos = S.removidos.orcamentos || []).push(id);   // lápide
  save(); fechar(); render();
}

/* ============================ 16. INÍCIO ============================= */
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') fechar(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fechar(); });

/* ====================== VENDAS DE PRODUTOS (avulsas) ======================
   Registro simples do que foi vendido no balcão: produto, quantidade, valor
   total, forma de pagamento, data e unidade. Fica em S.vendas (vai para a
   nuvem e para o backup junto com o resto). */
const FORMAS = ['Pix','Dinheiro','Cartão débito','Cartão crédito','Transferência'];
let VF = { per:'mes', q:'' };
const vendasU = () => (S.vendas || []).filter(v => U === 'todas' || v.unidade === U);
function vendasPeriodo(){
  const hj = hoje();
  const ini = { hoje:hj, sem:addDia(hj,-6), mes:hj.slice(0,8) + '01', trinta:addDia(hj,-29), tudo:'0000-00-00' }[VF.per] || '0000-00-00';
  const q = VF.q.trim().toLowerCase();
  return vendasU().filter(v => v.data >= ini && (!q || v.produto.toLowerCase().includes(q)))
    .sort((a,b) => b.data.localeCompare(a.data) || b.id - a.id);
}
const optUn = sel => C().unidades.map(u => `<option value="${u.id}" ${u.id===sel?'selected':''}>${h(u.curto)}</option>`).join('');
const optForma = sel => FORMAS.map(f => `<option ${f===sel?'selected':''}>${f}</option>`).join('');

function vVendas(){
  const nomes = [...new Set((S.vendas || []).map(v => v.produto))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  $app.innerHTML = `
  <div class="card"><h3>Registrar venda</h3>
    <label>O que foi vendido</label>
    <input id="vp" list="vnomes" placeholder="ex.: cadarço, palmilha, graxa" autocomplete="off">
    <datalist id="vnomes">${nomes.map(n => `<option value="${h(n)}">`).join('')}</datalist>
    <div class="row3">
      <div><label>Quantidade</label><input id="vq" type="number" min="1" step="1" inputmode="numeric" value="1"></div>
      <div><label>Valor total (R$)</label><input id="vv" type="number" min="0" step="0.01" inputmode="decimal"></div>
      <div><label>Data</label><input id="vd" type="date" value="${hoje()}"></div>
    </div>
    <div class="row">
      <div><label>Forma de pagamento</label><select id="vf">${optForma('Pix')}</select></div>
      <div><label>Unidade</label><select id="vu">${optUn(uDef())}</select></div>
    </div>
    <button class="b ok" onclick="registrarVenda()">✔ Registrar venda</button>
  </div>
  <div class="card"><input id="vbusca" placeholder="Filtrar por produto" value="${h(VF.q)}" oninput="VF.q=this.value;vVendasRes()" style="margin-bottom:0"></div>
  <div id="vres"></div>`;
  vVendasRes();
}
function setVP(k){ VF.per = k; vVendasRes(); }

function vVendasRes(){
  const box = document.getElementById('vres'); if(!box) return;
  const l = vendasPeriodo();
  const tot = l.reduce((t,v) => t + v.valor, 0), itens = l.reduce((t,v) => t + v.qtd, 0);
  const prod = {};
  l.forEach(v => { const k = v.produto.toLowerCase();
    const p = prod[k] = prod[k] || { nome:v.produto, qtd:0, total:0 }; p.qtd += v.qtd; p.total += v.valor; });
  const rank = Object.values(prod).sort((a,b) => b.total - a.total);
  const max = rank.length ? rank[0].total || 1 : 1;
  const pg = {}; l.forEach(v => pg[v.forma] = (pg[v.forma] || 0) + v.valor);
  const per = [['hoje','Hoje'],['sem','7 dias'],['mes','Este mês'],['trinta','30 dias'],['tudo','Tudo']];
  const un = v => U === 'todas' ? ` · ${h(UN(v.unidade).curto)}` : '';

  box.innerHTML = `
  <div class="seg">${per.map(([k,t]) => `<button class="b sm ${VF.per===k?'':'sec'}" onclick="setVP('${k}')">${t}</button>`).join('')}</div>
  <div class="grid" style="margin-top:10px">
    <div class="card kpi"><b>${R(tot)}</b><small>Total vendido</small></div>
    <div class="card kpi"><b>${l.length}</b><small>Vendas registradas</small></div>
    <div class="card kpi"><b>${itens}</b><small>Itens vendidos</small></div>
    <div class="card kpi"><b>${R(l.length ? tot / l.length : 0)}</b><small>Ticket médio</small></div>
  </div>
  ${rank.length ? `<div class="card"><h3>O que mais saiu (por valor)</h3>
    ${rank.slice(0,10).map(p => `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${h(p.nome)}</b><span><b>${R(p.total)}</b></span></div>
      <div class="bar"><i style="width:${Math.max(3, p.total / max * 100)}%"></i></div>
      <div class="hint">${p.qtd} un. vendida(s)</div></div>`).join('')}
    ${rank.length > 10 ? `<div class="hint">…e mais ${rank.length - 10} produto(s) na lista abaixo.</div>` : ''}
    <div class="sep"></div>
    <div class="hint"><b>Por forma de pagamento:</b> ${Object.entries(pg).sort((a,b) => b[1]-a[1]).map(([f,v]) => `${h(f)} ${R(v)}`).join(' · ')}</div>
  </div>` : ''}
  <div class="card"><h3>Vendas do período</h3>
    ${l.slice(0,100).map(v => `<div class="fila" style="cursor:default;align-items:center">
      <div><b>${h(v.produto)}</b> × ${v.qtd}<div class="hint">${fd(v.data)} · ${h(v.forma)}${un(v)}</div></div>
      <div style="text-align:right;white-space:nowrap"><b>${R(v.valor)}</b><br>
        <button class="b sec sm" onclick="editarVenda(${v.id})">✏️</button><button class="b er sm" onclick="excluirVenda(${v.id})">🗑️</button></div>
    </div>`).join('') || '<div class="hint">Nenhuma venda neste período.</div>'}
    ${l.length > 100 ? `<div class="hint" style="margin-top:6px">Mostrando as 100 mais recentes de ${l.length}. Use o filtro ou a exportação para ver tudo.</div>` : ''}
    ${l.length ? `<div class="sep"></div><button class="b sec sm" onclick="exportarVendas()">⬇️ Exportar período (CSV / Excel)</button>` : ''}
  </div>`;
}

function lerVenda(p){
  const g = k => document.getElementById(p + k);
  const produto = g('p').value.trim(), qtd = +g('q').value, valor = +g('v').value, data = g('d').value;
  if(!produto){ alert('Informe o que foi vendido.'); return null; }
  if(!(qtd > 0)){ alert('Informe a quantidade.'); return null; }
  if(!(valor > 0)){ alert('Informe o valor da venda.'); return null; }
  if(!data){ alert('Informe a data.'); return null; }
  return { produto, qtd, valor, data, forma:g('f').value, unidade:g('u').value };
}
function registrarVenda(){
  const d = lerVenda('v'); if(!d) return;
  (S.vendas = S.vendas || []).push(Object.assign({ id:Date.now(), criada:agora() }, d));
  localStorage.setItem('sap_uf', d.unidade);
  save(); render();
}
function editarVenda(id){
  const v = (S.vendas || []).find(x => x.id === id); if(!v) return;
  modal(`
  <h3>Editar venda</h3>
  <label>O que foi vendido</label><input id="ep" value="${h(v.produto)}">
  <div class="row3">
    <div><label>Quantidade</label><input id="eq" type="number" min="1" step="1" inputmode="numeric" value="${v.qtd}"></div>
    <div><label>Valor total (R$)</label><input id="ev" type="number" min="0" step="0.01" inputmode="decimal" value="${v.valor}"></div>
    <div><label>Data</label><input id="ed" type="date" value="${v.data}"></div>
  </div>
  <div class="row">
    <div><label>Forma de pagamento</label><select id="ef">${optForma(v.forma)}</select></div>
    <div><label>Unidade</label><select id="eu">${optUn(v.unidade)}</select></div>
  </div>
  <button class="b" onclick="salvarEdicaoVenda(${id})">Salvar</button>
  <button class="b sec" onclick="fechar()">Cancelar</button>
  <button class="b er" onclick="excluirVenda(${id})">Excluir</button>`);
}
function salvarEdicaoVenda(id){
  const v = (S.vendas || []).find(x => x.id === id); if(!v) return;
  const d = lerVenda('e'); if(!d) return;
  Object.assign(v, d); save(); fechar(); render();
}
function excluirVenda(id){
  const v = (S.vendas || []).find(x => x.id === id); if(!v) return;
  if(!confirm(`Excluir a venda de "${v.produto}" (${R(v.valor)})?`)) return;
  S.vendas = S.vendas.filter(x => x.id !== id);
  ((S.removidos = S.removidos || {}).vendas = S.removidos.vendas || []).push(id);   // lápide: impede a venda de voltar na sincronização
  save(); fechar(); render();
}
function exportarVendas(){
  const esc = t => '"' + String(t ?? '').replace(/"/g, '""') + '"';
  const linhas = [['Data','Produto','Quantidade','Valor (R$)','Forma de pagamento','Unidade'].map(esc).join(';')]
    .concat(vendasPeriodo().map(v => [fd(v.data), v.produto, v.qtd, String(v.valor.toFixed(2)).replace('.', ','), v.forma, UN(v.unidade).curto]
      .map((x,i) => i === 2 || i === 3 ? x : esc(x)).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + linhas.join('\r\n')], { type:'text/csv;charset=utf-8' }));
  a.download = `vendas-${hoje()}.csv`;
  a.click();
}

/* ====================== FLUXO DE CAIXA (tela Início) ======================
   Entradas = pagamentos recebidos nas OS + vendas avulsas (valem na data do recebimento).
   Saídas   = despesas lançadas aqui (S.despesas).  Tudo respeita o filtro de unidade. */
const CATS = ['Material / insumos','Aluguel','Funcionários','Água, luz e internet','Impostos e taxas','Manutenção','Marketing','Retirada do dono','Outros'];
let FX = { per:'sem', de:'', ate:'' };
const diaDe  = x => !x ? '' : (String(x).length === 10 ? String(x) : new Date(x).toLocaleDateString('sv-SE'));
const diaOS  = o => o.entrada || diaDe(o.criada);
const iniSemana = () => { const hj = hoje(); return addDia(hj, -((dow(hj) + 6) % 7)); };   // segunda-feira desta semana
const despesasU = () => (S.despesas || []).filter(x => U === 'todas' || x.unidade === U);

function fxIntervalo(){
  const hj = hoje(), sm = iniSemana();
  let r;
  if(FX.per === 'hoje') r = [hj, hj];
  else if(FX.per === 'ontem') r = [addDia(hj,-1), addDia(hj,-1)];
  else if(FX.per === 'sem') r = [sm, hj];
  else if(FX.per === 'semAnt') r = [addDia(sm,-7), addDia(sm,-1)];
  else if(FX.per === 'mes') r = [hj.slice(0,8) + '01', hj];
  else if(FX.per === '30') r = [addDia(hj,-29), hj];
  else r = [FX.de || addDia(hj,-29), FX.ate || hj];
  return r[0] > r[1] ? [r[1], r[0]] : r;
}

/* Todas as movimentações do período, da mais recente para a mais antiga */
function movimentos(de, ate){
  const m = [], no = d => d >= de && d <= ate;
  osU().forEach(o => (o.pagamentos || []).forEach(p => {
    const d = diaDe(p.data);
    if(no(d)) m.push({ tipo:'os', ent:true, data:d, hora:String(p.data || ''), valor:+p.valor || 0, forma:p.forma || '—',
      un:o.unidade, ref:o.id, desc:`OS #${o.numero} · ${o.cliente}` });
  }));
  vendasU().forEach(v => { if(no(v.data)) m.push({ tipo:'venda', ent:true, data:v.data, hora:String(v.criada || ''),
    valor:+v.valor || 0, forma:v.forma || '—', un:v.unidade, ref:v.id, desc:`${v.produto} × ${v.qtd}` }); });
  despesasU().forEach(x => { if(no(x.data)) m.push({ tipo:'saida', ent:false, data:x.data, hora:String(x.criada || ''),
    valor:+x.valor || 0, forma:x.forma || '—', un:x.unidade, ref:x.id, cat:x.categoria || 'Outros',
    desc:x.descricao || x.categoria || 'Despesa' }); });
  return m.sort((a, b) => b.data.localeCompare(a.data) || b.hora.localeCompare(a.hora));
}
const somaMov = (m, ent) => m.filter(x => x.ent === ent).reduce((t, x) => t + x.valor, 0);

/* Cartões do topo: quanto entrou hoje / na semana e quantas OS novas */
function blocoHoje(){
  const hj = hoje(), sm = iniSemana();
  const k = (n, l, s) => `<div class="card kpi"><b>${n}</b><small>${l}</small>${s ? `<small>${s}</small>` : ''}</div>`;
  const resumo = de => {
    const m = movimentos(de, hj);
    const os = m.filter(x => x.tipo === 'os').reduce((t, x) => t + x.valor, 0);
    const vd = m.filter(x => x.tipo === 'venda').reduce((t, x) => t + x.valor, 0);
    const novas = osU().filter(o => o.status !== 'Cancelado' && diaOS(o) >= de && diaOS(o) <= hj);
    return { ent:os + vd, os, vd, novas, lancado:novas.reduce((t, o) => t + (+o.valor || 0), 0) };
  };
  const a = resumo(hj), b = resumo(sm);
  return `<div class="grid">
    ${k(R(a.ent), 'Entrou hoje', `OS ${R(a.os)} · Vendas ${R(a.vd)}`)}
    ${k(a.novas.length, 'OS novas hoje', `Valor lançado ${R(a.lancado)}`)}
    ${k(R(b.ent), 'Entrou na semana', `desde seg ${fd(sm)} · OS ${R(b.os)} · Vendas ${R(b.vd)}`)}
    ${k(b.novas.length, 'OS novas na semana', `Valor lançado ${R(b.lancado)}`)}
  </div>`;
}

function blocoFluxo(){
  const per = [['hoje','Hoje'],['ontem','Ontem'],['sem','Semana'],['semAnt','Sem. passada'],['mes','Mês'],['30','30 dias'],['outro','Outro']];
  return `<div class="card" id="fxcard"><h3>Fluxo de caixa</h3>
    <div class="seg">${per.map(([k, t]) => `<button class="b sm ${FX.per === k ? '' : 'sec'}" onclick="setFX('${k}')">${t}</button>`).join('')}</div>
    ${FX.per === 'outro' ? `<div class="row" style="margin-top:8px">
      <div><label>De</label><input type="date" value="${FX.de || addDia(hoje(), -29)}" onchange="FX.de=this.value;fxRender()"></div>
      <div><label>Até</label><input type="date" value="${FX.ate || hoje()}" onchange="FX.ate=this.value;fxRender()"></div></div>` : ''}
    <div id="fx"></div></div>`;
}
function setFX(k){
  FX.per = k;
  const c = document.getElementById('fxcard'); if(c) c.outerHTML = blocoFluxo();
  fxRender();
}

function fxRender(){
  const box = document.getElementById('fx'); if(!box) return;
  const [de, ate] = fxIntervalo();
  const m = movimentos(de, ate);
  const ent = somaMov(m, true), sai = somaMov(m, false), res = ent - sai;
  const aReceber = osU().filter(o => o.status !== 'Cancelado').reduce((t, o) => t + saldo(o), 0);

  // agrupa por dia (ou por mês quando o período é longo)
  const dias = diasEntre(de + 'T12:00', ate + 'T12:00') + 1;
  const porMes = dias > 62;
  const key = d => porMes ? d.slice(0, 7) : d;
  const mapa = {};
  if(!porMes) for(let d = de; d <= ate; d = addDia(d, 1)) mapa[d] = { k:d, e:0, s:0 };
  m.forEach(x => { const kk = key(x.data); const g = mapa[kk] = mapa[kk] || { k:kk, e:0, s:0 }; if(x.ent) g.e += x.valor; else g.s += x.valor; });
  const gr = Object.values(mapa).sort((a, b) => a.k.localeCompare(b.k));
  const SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
  const rot = kk => porMes ? kk.slice(5) + '/' + kk.slice(0, 4) : fd(kk).slice(0, 5);
  const rot2 = kk => porMes ? '' : SEM[dow(kk)];
  const mx = Math.max(1, ...gr.map(g => Math.max(g.e, g.s)));
  const alt = v => v ? Math.max(3, v / mx * 100) : 0;
  let acc = 0;
  const linhas = gr.map(g => { acc += g.e - g.s; return Object.assign({}, g, { acc }); });
  const vis = linhas.length <= 14 ? linhas : linhas.filter(g => g.e || g.s);
  const cls = v => v < 0 ? 'fxn' : 'fxp';

  const somar = (arr, kf) => { const o = {}; arr.forEach(x => { const n = kf(x); o[n] = (o[n] || 0) + x.valor; });
    return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const barras = (lista, total, c) => lista.map(([n, v]) => `<div style="margin-bottom:7px">
    <div style="display:flex;justify-content:space-between;gap:8px"><span>${h(n)}</span>
    <span><b>${R(v)}</b> <span class="hint">${total ? Math.round(v / total * 100) : 0}%</span></span></div>
    <div class="bar"><i class="${c || ''}" style="width:${total ? Math.max(3, v / total * 100) : 0}%"></i></div></div>`).join('');
  const me = m.filter(x => x.ent), ms = m.filter(x => !x.ent);

  const extrato = m.slice(0, 60).map(x => {
    const clique = x.tipo === 'os' ? `detalhe(${x.ref})` : x.tipo === 'venda' ? `editarVenda(${x.ref})` : `novaDespesa(${x.ref})`;
    return `<div class="fila" style="align-items:center" onclick="${clique}">
      <div>${x.tipo === 'os' ? '🔧' : x.tipo === 'venda' ? '🛒' : '💸'} <b>${h(x.desc)}</b>
        <div class="hint">${fd(x.data)}${x.hora.length > 10 ? ' · ' + fh(x.hora) : ''} · ${h(x.tipo === 'saida' ? x.cat + ' · ' + x.forma : x.forma)}${U === 'todas' ? ' · ' + h(UN(x.un).curto) : ''}</div></div>
      <b class="${x.ent ? 'fxp' : 'fxn'}" style="white-space:nowrap">${x.ent ? '+' : '−'} ${R(x.valor)}</b></div>`; }).join('');

  const inner = 'box-shadow:none;background:#faf7f4';
  box.innerHTML = `
  <div class="hint" style="margin:8px 0 0">Período: <b>${de === ate ? fd(de) : fd(de) + ' a ' + fd(ate)}</b></div>
  <div class="grid" style="margin-top:8px">
    <div class="card kpi" style="${inner}"><b class="fxp">${R(ent)}</b><small>Entradas</small></div>
    <div class="card kpi" style="${inner}"><b class="fxn">${R(sai)}</b><small>Saídas</small></div>
    <div class="card kpi" style="${inner}"><b class="${cls(res)}">${R(res)}</b><small>Saldo do período</small></div>
    <div class="card kpi" style="${inner}"><b>${R(aReceber)}</b><small>A receber (OS com saldo)</small></div>
  </div>
  <div class="hint" style="margin-bottom:8px">Saldo + a receber = <b>${R(res + aReceber)}</b> se todos os saldos em aberto forem pagos.</div>

  <button class="b ok" onclick="novaDespesa()">➕ Registrar saída</button>
  <button class="b sec" onclick="exportarFluxo()">⬇️ Exportar (CSV / Excel)</button>

  <div class="sep"></div>
  <div class="fx-leg"><span><i class="fx-dot" style="background:var(--ok)"></i> Entradas</span><span><i class="fx-dot" style="background:var(--er)"></i> Saídas</span></div>
  <div class="fx-chart">${gr.map(g => `<div class="fx-col">
    <div class="fx-bars"><i class="e" style="height:${alt(g.e)}px" title="Entradas ${R(g.e)}"></i><i class="s" style="height:${alt(g.s)}px" title="Saídas ${R(g.s)}"></i></div>
    <small>${rot(g.k)}</small>${rot2(g.k) ? `<small>${rot2(g.k)}</small>` : ''}</div>`).join('')}</div>

  <div style="overflow-x:auto;margin-top:8px"><table class="fx-tab">
    <thead><tr><th>${porMes ? 'Mês' : 'Dia'}</th><th>Entradas</th><th>Saídas</th><th>Saldo</th><th>Acumulado</th></tr></thead>
    <tbody>${vis.map(g => `<tr><td>${rot(g.k)}${rot2(g.k) ? ' <span class="hint">' + rot2(g.k) + '</span>' : ''}</td>
      <td>${g.e ? R(g.e) : '—'}</td><td>${g.s ? R(g.s) : '—'}</td>
      <td class="${cls(g.e - g.s)}">${g.e || g.s ? R(g.e - g.s) : '—'}</td><td class="${cls(g.acc)}">${R(g.acc)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="fxp">${R(ent)}</td><td class="fxn">${R(sai)}</td><td class="${cls(res)}">${R(res)}</td><td></td></tr></tfoot>
  </table></div>

  ${ent > 0 ? `<div class="sep"></div><h3 style="margin-top:4px">Entradas por forma de pagamento</h3>
    ${barras(somar(me, x => x.forma), ent)}
    <div class="hint"><b>Origem:</b> OS ${R(me.filter(x => x.tipo === 'os').reduce((t, x) => t + x.valor, 0))} · Vendas de produtos ${R(me.filter(x => x.tipo === 'venda').reduce((t, x) => t + x.valor, 0))}</div>
    ${U === 'todas' ? `<div class="hint" style="margin-top:4px"><b>Por unidade:</b> ${somar(me, x => UN(x.un).curto).map(([n, v]) => `${h(n)} ${R(v)}`).join(' · ')}</div>` : ''}` : ''}
  ${sai > 0 ? `<div class="sep"></div><h3 style="margin-top:4px">Saídas por categoria</h3>
    ${barras(somar(ms, x => x.cat), sai, 'f')}` : ''}

  <div class="sep"></div>
  <h3 style="margin-top:4px">Movimentações do período</h3>
  ${extrato || '<div class="hint">Nenhuma movimentação neste período.</div>'}
  ${m.length > 60 ? `<div class="hint" style="margin-top:6px">Mostrando as 60 mais recentes de ${m.length}. A exportação traz tudo.</div>` : ''}
  <div class="hint" style="margin-top:8px">Entradas = pagamentos registrados nas OS + vendas de produtos, na data em que foram recebidos. Saídas = despesas lançadas aqui. Toque em uma linha para abrir ou editar.</div>`;
}

function novaDespesa(id){
  const x = id ? (S.despesas || []).find(d => d.id === id) : null;
  modal(`
  <h3>${x ? 'Editar saída' : '💸 Registrar saída'}</h3>
  <label>Descrição</label><input id="xd" value="${h(x ? x.descricao : '')}" placeholder="ex.: couro, cola, conta de luz" autocomplete="off">
  <div class="row3">
    <div><label>Valor (R$)</label><input id="xv" type="number" min="0" step="0.01" inputmode="decimal" value="${x ? x.valor : ''}"></div>
    <div><label>Data</label><input id="xdt" type="date" value="${x ? x.data : hoje()}"></div>
    <div><label>Categoria</label><select id="xc">${CATS.map(c => `<option ${x && x.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
  </div>
  <div class="row">
    <div><label>Forma de pagamento</label><select id="xf">${optForma(x ? x.forma : 'Pix')}</select></div>
    <div><label>Unidade</label><select id="xu">${optUn(x ? x.unidade : uDef())}</select></div>
  </div>
  <button class="b" onclick="salvarDespesa(${id || 0})">Salvar</button>
  <button class="b sec" onclick="fechar()">Cancelar</button>
  ${x ? `<button class="b er" onclick="excluirDespesa(${x.id})">Excluir</button>` : ''}`);
}
function salvarDespesa(id){
  const g = k => document.getElementById(k).value;
  const valor = +g('xv'), data = g('xdt');
  if(!(valor > 0)) return alert('Informe o valor da saída.');
  if(!data) return alert('Informe a data.');
  const d = { descricao:g('xd').trim(), valor, data, categoria:g('xc'), forma:g('xf'), unidade:g('xu') };
  S.despesas = S.despesas || [];
  if(id){ const x = S.despesas.find(z => z.id === id); if(x) Object.assign(x, d); }
  else { S.despesas.push(Object.assign({ id:Date.now(), criada:agora() }, d)); localStorage.setItem('sap_uf', d.unidade); }
  save(); fechar(); render();
}
function excluirDespesa(id){
  const x = (S.despesas || []).find(z => z.id === id); if(!x) return;
  if(!confirm(`Excluir a saída "${x.descricao || x.categoria}" (${R(x.valor)})?`)) return;
  S.despesas = S.despesas.filter(z => z.id !== id);
  ((S.removidos = S.removidos || {}).despesas = S.removidos.despesas || []).push(id);   // lápide
  save(); fechar(); render();
}
function exportarFluxo(){
  const [de, ate] = fxIntervalo();
  const esc = t => '"' + String(t ?? '').replace(/"/g, '""') + '"';
  const num = v => v.toFixed(2).replace('.', ',');
  const linhas = [['Data','Tipo','Descrição','Categoria / forma','Unidade','Entrada (R$)','Saída (R$)'].map(esc).join(';')]
    .concat(movimentos(de, ate).reverse().map(x => [fd(x.data), x.tipo === 'os' ? 'OS' : x.tipo === 'venda' ? 'Venda' : 'Saída',
      x.desc, x.tipo === 'saida' ? x.cat + ' / ' + x.forma : x.forma, UN(x.un).curto].map(esc)
      .concat([x.ent ? num(x.valor) : '', x.ent ? '' : num(x.valor)]).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + linhas.join('\r\n')], { type:'text/csv;charset=utf-8' }));
  a.download = `fluxo-de-caixa-${de}-a-${ate}.csv`;
  a.click();
}

/* ============ ANIMAÇÕES (não alteram nenhuma função do sistema) ============ */
function contar(el){
  const t = el.textContent.trim(); let alvo, fmt;
  if(/^\d+$/.test(t)){ alvo = +t; fmt = v => String(Math.round(v)); }
  else if(/^R\$/.test(t)){ alvo = parseFloat(t.replace(/[^\d,]/g,'').replace(',','.')); fmt = v => R(v); }
  else return;
  if(!(alvo > 0)) return;
  const ini = performance.now(), dur = 900;
  const passo = n => { const p = Math.min(1,(n-ini)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(alvo*e); if(p < 1) requestAnimationFrame(passo); else el.textContent = t; };
  requestAnimationFrame(passo);
}
function animar(){
  const alvos = document.querySelectorAll('#app > .card, #app > .grid > .card, #lista > .card, #listaCli > .card, #app > .seg');
  alvos.forEach((el,i) => { el.classList.remove('rv'); void el.offsetWidth; el.style.animationDelay = Math.min(i,14)*45 + 'ms'; el.classList.add('rv'); });
  document.querySelectorAll('.kpi b').forEach(contar);
}
const _render = render;
render = function(){ _render(); animar(); };
const _vOSLista = vOSLista;

const _vCliLista = vCliLista;
