<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL  = (window.SAPATARIA || {}).supabaseUrl;
  const SUPABASE_ANON = (window.SAPATARIA || {}).supabaseAnon;   // chave pública (anon). Nunca coloque a service_role aqui.
  const TABELA = 'sapataria_estado', LINHA = 'principal', CHAVE_LOCAL = 'sapataria_v3';
  const byId = id => document.getElementById(id);
  (function(){ const l = (window.SAPATARIA || {}).loja; if(l){ byId('lg-titulo').textContent = l; document.title = l + ' – Controle de Produção'; } })();

  /* ---------- utilidades de tela ---------- */
  function selo(estado, txt){ const s = byId('nuvem-selo'); s.className = 'on ' + estado; byId('nuvem-txt').textContent = txt; }
  function status(txt){ byId('lg-status').hidden = !txt; byId('lg-status-txt').textContent = txt || ''; }
  function erro(txt){ byId('lg-erro').textContent = txt || ''; }
  function falhaGrave(txt){
    status(''); byId('lg-form').hidden = true; erro(txt);
    const r = byId('lg-retry'); r.hidden = false; r.onclick = () => location.reload();
  }
  const comTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

  /* A logo já está embutida no código do sistema; reaproveita na tela de login. */
  (function logo(){
    const lg = (window.SAPATARIA || {}).logo;
    if(lg){ byId('lg-logo').src = lg; byId('logoSplash').src = lg; }
  })();

  if(!window.supabase || !window.supabase.createClient){
    falhaGrave('Não foi possível carregar o sistema de login. Verifique a internet e tente de novo.');
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  /* ---------- junção de dados entre aparelhos ----------
     Cada aparelho guarda uma "foto" (assinaturas) de como os dados estavam na
     última vez que bateram com a nuvem. Ao salvar ou ao receber novidades, cada
     OS / venda / despesa / contato é comparado com essa foto: o que mudou aqui
     vem daqui, o que mudou lá vem de lá. Assim um aparelho não apaga a
     alteração do outro (ex.: OS marcada como Entregue em outro celular). */
  const semInternos = (k, v) => (k && k[0] === '_') ? undefined : v;     // _mod etc. não contam
  function hash(str){                                                       // cyrb53
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  const assin = x => hash(JSON.stringify(x, semInternos));
  const assinCfg = c => assin(Object.assign({}, c, { proxNumero:0,
    unidades:(c && c.unidades || []).map(u => Object.assign({}, u, { proxNumero:0 })) }));
  const LISTAS = ['os','vendas','despesas','orcamentos'];
  function indexar(st){
    const ix = { config: assinCfg(st.config || {}), contatos:{} };
    LISTAS.forEach(k => { ix[k] = {}; (st[k] || []).forEach(x => { ix[k][String(x.id)] = assin(x); }); });
    Object.keys(st.contatos || {}).forEach(f => { ix.contatos[f] = assin(st.contatos[f]); });
    return ix;
  }
  const mod = x => (x && x._mod) || 0;
  // b = assinatura na foto (undefined = não existia), l = daqui, r = da nuvem
  function escolher(b, l, r, semFoto, juntar){
    if(semFoto){                                    // sem foto: não dá para saber quem apagou; fica com o mais recente
      if(l && r) return mod(l) > mod(r) ? l : r;
      return l || r;
    }
    const mudouAqui = l ? assin(l) !== b : b !== undefined;
    const mudouLa   = r ? assin(r) !== b : b !== undefined;
    if(!mudouAqui) return r;
    if(!mudouLa)   return l;
    if(!l || !r)   return l || r;                   // um apagou e o outro editou: mantém a edição
    if(juntar) return juntar(l, r);
    return mod(l) >= mod(r) ? l : r;
  }
  function mesclar(foto, L, Rm){
    const semFoto = !foto, out = {};
    Object.keys(Rm).concat(Object.keys(L)).forEach(k => { if(!(k in out)) out[k] = (k in L) ? L[k] : Rm[k]; });
    LISTAS.forEach(k => {
      const lm = new Map((L[k] || []).map(x => [String(x.id), x]));
      const rm = new Map((Rm[k] || []).map(x => [String(x.id), x]));
      const ids = [...rm.keys(), ...[...lm.keys()].filter(id => !rm.has(id))];
      out[k] = ids.map(id => escolher(foto && (foto[k] || {})[id], lm.get(id), rm.get(id), semFoto)).filter(Boolean);
    });
    out.contatos = {};
    const cl = L.contatos || {}, cr = Rm.contatos || {};
    new Set([...Object.keys(cr), ...Object.keys(cl)]).forEach(f => {
      const v = escolher(foto && (foto.contatos || {})[f], cl[f], cr[f], semFoto, (a, b) => {
        const vistos = new Set(), todos = [];
        a.concat(b).forEach(x => { const s = JSON.stringify(x); if(!vistos.has(s)){ vistos.add(s); todos.push(x); } });
        return todos.sort((x, y) => String(x.data).localeCompare(String(y.data)));
      });
      if(v) out.contatos[f] = v;
    });
    const lc = L.config || {}, rc = Rm.config || {};
    let cfg;
    if(semFoto) cfg = rc;
    else{
      const aqui = assinCfg(lc) !== foto.config, la = assinCfg(rc) !== foto.config;
      cfg = aqui && !la ? lc : (!aqui ? rc : lc);
    }
    cfg = JSON.parse(JSON.stringify(cfg));
    // numeração de OS: nunca volta para trás
    cfg.proxNumero = Math.max(+lc.proxNumero || 0, +rc.proxNumero || 0) || cfg.proxNumero;
    (cfg.unidades || []).forEach(u => {
      const a = (lc.unidades || []).find(x => x.id === u.id), b = (rc.unidades || []).find(x => x.id === u.id);
      u.proxNumero = Math.max(+u.proxNumero || 0, a ? +a.proxNumero || 0 : 0, b ? +b.proxNumero || 0 : 0);
    });
    // lápides de vendas/despesas apagadas (usadas pela versão anterior do sistema)
    const rmv = {};
    ['vendas','despesas','orcamentos'].forEach(k => {
      rmv[k] = [...new Set([...((L.removidos || {})[k] || []), ...((Rm.removidos || {})[k] || [])])];
      const g = new Set(rmv[k]); out[k] = out[k].filter(x => !g.has(x.id));
    });
    out.removidos = rmv;
    // nunca fica abaixo da maior OS existente da unidade
    (cfg.unidades || []).forEach(u => {
      const mx = out.os.filter(o => o.unidade === u.id).reduce((t, o) => Math.max(t, +o.numero || 0), 0);
      if(mx >= +u.proxNumero) u.proxNumero = mx + 1;
    });
    out.config = cfg;
    return out;
  }

  let FOTO = null, VERSAO = null, ULTIMO = null, SEQ = 0;
  try{ FOTO = JSON.parse(localStorage.getItem('sap_foto') || 'null'); }catch(e){ FOTO = null; }
  function definirFoto(st){
    FOTO = indexar(st);
    try{ localStorage.setItem('sap_foto', JSON.stringify(FOTO)); }catch(e){}
  }
  // troca o conteúdo de S sem trocar o objeto (o sistema guarda referências a ele)
  function aplicar(novo){
    Object.keys(S).forEach(k => { delete S[k]; });
    Object.assign(S, novo);
    if(typeof migrar === 'function') migrar();
    localStorage.setItem(CHAVE_LOCAL, JSON.stringify(S));
    ULTIMO = indexar(S);
  }
  function redesenhar(){
    const a = document.activeElement;
    if(a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
      setTimeout(redesenhar, 3000); return;         // não atrapalha quem está digitando
    }
    if(typeof render === 'function') render();
  }

  /* ---------- envio para a nuvem ---------- */
  const Nuvem = {
    _t: null, _enviando: false,
    // chamado pelo save(): carimba a hora em cada item que acabou de mudar neste aparelho
    carimbar(){
      SEQ++;
      if(!ULTIMO) ULTIMO = FOTO;
      const agoraMs = Date.now(), ant = ULTIMO || { os:{}, vendas:{}, despesas:{}, contatos:{} };
      LISTAS.forEach(k => (S[k] || []).forEach(x => { if((ant[k] || {})[String(x.id)] !== assin(x)) x._mod = agoraMs; }));
      ULTIMO = indexar(S);
    },
    agendar(){ clearTimeout(this._t); selo('', 'Salvando…'); this._t = setTimeout(() => this.enviar(), 800); },
    async enviar(){
      if(this._enviando){ this.agendar(); return; }
      this._enviando = true; clearTimeout(this._t);
      const seq = SEQ, inicio = indexar(S);
      try{
        const cab = await sb.from(TABELA).select('atualizado_em').eq('id', LINHA).maybeSingle();
        if(cab.error) throw cab.error;
        let alvo = S, versaoLa = cab.data && cab.data.atualizado_em, mesclou = false;
        if(cab.data && versaoLa !== VERSAO){                     // outro aparelho salvou: junta antes de enviar
          const rem = await sb.from(TABELA).select('dados, atualizado_em').eq('id', LINHA).single();
          if(rem.error) throw rem.error;
          alvo = mesclar(FOTO, S, rem.data.dados || {}); versaoLa = rem.data.atualizado_em; mesclou = true;
        }
        const linha = { dados: alvo, atualizado_em: new Date().toISOString() };
        const r = cab.data
          ? await sb.from(TABELA).update(linha).eq('id', LINHA).eq('atualizado_em', versaoLa).select('atualizado_em')
          : await sb.from(TABELA).insert(Object.assign({ id: LINHA }, linha)).select('atualizado_em');
        if(r.error && r.error.code !== '23505') throw r.error;
        if(r.error || !r.data || !r.data.length){              // alguém salvou no mesmo instante: tenta de novo
          this._enviando = false; this._t = setTimeout(() => this.enviar(), 400); return;
        }
        VERSAO = r.data[0].atualizado_em;
        definirFoto(alvo);
        if(mesclou){ aplicar(mesclar(inicio, S, alvo)); redesenhar(); }
        if(SEQ === seq){ localStorage.removeItem('sap_pendente'); selo('ok', 'Salvo na nuvem'); }
        else this.agendar();                                   // houve alteração durante o envio
      }catch(e){
        console.error('Falha ao salvar na nuvem', e);
        selo('er', msgBanco(e) || 'Sem conexão — será reenviado');
        this._t = setTimeout(() => this.enviar(), 15000);
      }finally{ this._enviando = false; }
    },
    // busca alterações feitas em outros aparelhos
    async verificar(){
      if(this._enviando || localStorage.getItem('sap_pendente') || typeof S === 'undefined') return;
      try{
        const cab = await sb.from(TABELA).select('atualizado_em').eq('id', LINHA).maybeSingle();
        if(cab.error || !cab.data || cab.data.atualizado_em === VERSAO) return;
        const rem = await sb.from(TABELA).select('dados, atualizado_em').eq('id', LINHA).single();
        if(rem.error || !rem.data) return;
        if(this._enviando || localStorage.getItem('sap_pendente')) return;   // mexeram aqui enquanto baixava: o envio junta
        const novo = mesclar(FOTO, S, rem.data.dados || {});
        VERSAO = rem.data.atualizado_em;
        definirFoto(rem.data.dados || {});
        aplicar(novo);
        selo('ok', 'Atualizado');
        redesenhar();
      }catch(e){ console.error('Falha ao buscar novidades', e); }
    }
  };
  window.Nuvem = Nuvem;
  document.addEventListener('visibilitychange', () => {
    if(typeof S === 'undefined') return;
    if(document.visibilityState === 'hidden' && localStorage.getItem('sap_pendente')) Nuvem.enviar();
    if(document.visibilityState === 'visible') Nuvem.verificar();
  });
  window.addEventListener('focus', () => Nuvem.verificar());
  setInterval(() => { if(document.visibilityState === 'visible') Nuvem.verificar(); }, 10000);

  function msgBanco(e){
    const t = ((e && (e.code || '')) + ' ' + (e && (e.message || ''))).toLowerCase();
    if(t.includes('42p01') || t.includes('pgrst205') || t.includes('could not find the table'))
      return 'Banco não configurado: rode o SQL da tabela no Supabase';
    if(t.includes('42501') || t.includes('row-level security') || t.includes('permission denied'))
      return 'Sem permissão no banco: confira a política do Supabase';
    return '';
  }

  /* ---------- login ---------- */
  function pedirLogin(){
    return new Promise(resolve => {
      status(''); erro('');
      const form = byId('lg-form'), email = byId('lg-email'), senha = byId('lg-senha'), btn = byId('lg-ok');
      form.hidden = false;
      email.value = localStorage.getItem('sap_email') || '';
      (email.value ? senha : email).focus();

      byId('lg-ver').onclick = function(){
        const ver = senha.type === 'password';
        senha.type = ver ? 'text' : 'password';
        this.textContent = ver ? 'Ocultar' : 'Mostrar';
        this.setAttribute('aria-pressed', String(ver));
      };

      form.onsubmit = async ev => {
        ev.preventDefault();
        erro(''); btn.disabled = true; btn.textContent = 'Entrando…';
        let res;
        try{
          res = await comTimeout(sb.auth.signInWithPassword({ email: email.value.trim(), password: senha.value }), 15000);
        }catch(e){ res = { error: { message: 'rede' } }; }
        btn.disabled = false; btn.textContent = 'Entrar';
        if(res.error){
          const m = (res.error.message || '').toLowerCase();
          erro(m.includes('invalid') || res.error.status === 400
            ? 'E-mail ou senha incorretos.'
            : 'Não foi possível conectar. Verifique a internet e tente de novo.');
          senha.select();
          return;
        }
        localStorage.setItem('sap_email', email.value.trim());
        senha.value = '';
        form.hidden = true;
        resolve();
      };
    });
  }

  /* ---------- sincronização inicial ---------- */
  async function sincronizar(){
    status('Carregando seus dados…');
    try{
      const { data, error } = await comTimeout(sb.from(TABELA).select('dados, atualizado_em').eq('id', LINHA).maybeSingle(), 15000);
      if(error) throw error;
      const local = localStorage.getItem(CHAVE_LOCAL);
      if(data && !localStorage.getItem('sap_pendente')){
        localStorage.setItem(CHAVE_LOCAL, JSON.stringify(data.dados));          // nuvem manda
        VERSAO = data.atualizado_em; definirFoto(data.dados || {});
      }else if(data && local){
        // alteração deste aparelho que não chegou à nuvem: junta com o que os outros salvaram
        localStorage.setItem(CHAVE_LOCAL, JSON.stringify(mesclar(FOTO, JSON.parse(local), data.dados || {})));
        VERSAO = data.atualizado_em; definirFoto(data.dados || {});
        ULTIMO = indexar(JSON.parse(localStorage.getItem(CHAVE_LOCAL)));
        setTimeout(() => Nuvem.enviar(), 1500);                                   // envia depois que o sistema abrir
      }else if(local){
        const r = await comTimeout(sb.from(TABELA).upsert({ id: LINHA, dados: JSON.parse(local), atualizado_em: new Date().toISOString() }), 15000);
        if(r.error) throw r.error;                                               // 1ª migração
        localStorage.removeItem('sap_pendente');
        definirFoto(JSON.parse(local));
      }
      selo('ok', 'Conectado à nuvem');
    }catch(e){
      console.error(e);
      selo('er', msgBanco(e) || 'Sem conexão — usando dados deste aparelho');
    }
  }

  function abrirSistema(){
    byId('login').hidden = true;
    byId('nuvem-sair').onclick = async () => { try{ await sb.auth.signOut(); }catch(e){} location.reload(); };
    const s = document.createElement('script');
    s.textContent = byId('app-code').textContent;
    document.body.appendChild(s);
  }

  (async function iniciar(){
    try{
      let sessao = null;
      try{ sessao = (await comTimeout(sb.auth.getSession(), 8000)).data.session; }catch(e){ sessao = null; }
      if(!sessao) await pedirLogin();
      await sincronizar();
      abrirSistema();
    }catch(e){
      console.error(e);
      falhaGrave('Algo deu errado ao abrir o sistema. Recarregue a página.');
    }
  })();
})();
</script>
