<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1c1b">
<title>Sapataria – Controle de Produção</title>
<style>
:root{
  --c:#c8102e; --c2:#8f0b20; --dk:#1e1c1b; --bg:#f4f2f0; --card:#fff;
  --ok:#2e9e5b; --er:#d64545; --wa:#25d366; --am:#e8a317; --tx:#2b2b2b; --mut:#7b7166;
  --sh:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(124,74,30,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 100% -10%,#fbf6f0,var(--bg)) no-repeat,var(--bg);
  color:var(--tx); padding-bottom:78px; font-size:15px; line-height:1.45;
}
header{
  background:var(--dk);border-bottom:3px solid var(--c);
  color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:6;box-shadow:0 2px 14px rgba(0,0,0,.18)
}
header h1{font-size:17px;margin:0;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.logo{height:44px;width:46px;object-fit:contain;border-radius:8px;background:var(--dk)}
header .sub{font-size:11px;opacity:.85;display:block;font-weight:400}
nav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;z-index:6;
  box-shadow:0 -1px 0 #e8ded2,0 -8px 24px rgba(0,0,0,.07);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--mut);
  font-weight:500;cursor:pointer;position:relative;transition:color .15s
}
nav button span{display:block;font-size:19px;line-height:1.25}
nav button.on{color:var(--c);font-weight:700}
nav button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--c)}
main{max-width:1120px;margin:auto;padding:12px 12px 20px}
@media(min-width:820px){
  nav{position:sticky;top:56px;left:0;right:0;max-width:1120px;margin:0 auto;background:transparent;
      box-shadow:none;padding:10px 12px 0;gap:8px}
  nav button{background:#fff;border-radius:10px;padding:10px 6px;font-size:13px;box-shadow:var(--sh);flex:0 1 160px}
  nav button span{display:inline;font-size:16px;margin-right:4px;vertical-align:-1px}
  nav button.on{background:var(--c);color:#fff}
  nav button.on::after{display:none}
  body{padding-bottom:20px}
  header h1{font-size:19px}
}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.card{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--c);letter-spacing:.2px}
.kpi b{font-size:23px;display:block;color:var(--dk);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
.os{border-left:5px solid #cfc5b8;transition:transform .12s}
.os:active{transform:scale(.995)}
.os.urg{border-color:var(--er)}
.os.atr{background:linear-gradient(90deg,#fff4f4,#fff)}
.os.risco{background:linear-gradient(90deg,#fff9e8,#fff)}
.tag{display:inline-block;font-size:10.5px;padding:2.5px 8px;border-radius:20px;background:#efe9e1;color:#5e5548;
     margin:3px 3px 0 0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.tag.er{background:var(--er);color:#fff}
.tag.am{background:var(--am);color:#fff}
.tag.ok{background:var(--ok);color:#fff}
.tag.cb{background:#3b4a5a;color:#fff}
button.b,a.b{
  background:var(--c);color:#fff;border:0;border-radius:9px;padding:9px 13px;font-size:13.5px;font-weight:600;
  margin:4px 4px 0 0;cursor:pointer;text-decoration:none;display:inline-block;touch-action:manipulation;
  transition:filter .15s,transform .1s
}
button.b:active,a.b:active{transform:scale(.97);filter:brightness(1.08)}
.b.wa{background:var(--wa);color:#04381b}
.b.sec{background:#ebe7e3;color:#2b2726}
.b.er{background:var(--er)}
.b.ok{background:var(--ok)}
.b.sm{padding:6px 10px;font-size:12.5px}
input,select,textarea{
  width:100%;padding:10px;border:1px solid #dbd2c6;border-radius:10px;font-size:16px;margin:3px 0 9px;
  background:#fffdfb;color:var(--tx);font-family:inherit
}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(124,74,30,.28);border-color:var(--c2)}
textarea{min-height:70px;resize:vertical}
label{font-size:12.5px;color:var(--mut);font-weight:600;display:block}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.row3{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.row3{grid-template-columns:1fr 1fr}}
.chk label{display:inline-flex;align-items:center;gap:5px;margin:3px 9px 3px 0;font-size:14px;color:var(--tx);font-weight:500}
.chk input{width:auto;margin:0}
.bar{background:#e8ded0;border-radius:9px;height:17px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#54c07c,var(--ok));transition:width .3s}
.bar i.w{background:linear-gradient(90deg,#f0bd48,var(--am))}
.bar i.f{background:linear-gradient(90deg,#e26a6a,var(--er))}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.fila{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #f1eae1;cursor:pointer;font-size:14px}
.fila:first-of-type{border-top:0}
#modal{position:fixed;inset:0;background:rgba(30,20,10,.55);display:none;align-items:flex-start;
       justify-content:center;overflow:auto;z-index:20;padding:10px;-webkit-overflow-scrolling:touch}
#modal>div{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:660px;margin:8px 0 40px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal h3{margin:0 0 6px;color:var(--c)}
#modal h4{margin:14px 0 4px;color:var(--c);font-size:14px}
.chip{border:1px solid #e0d6c9;border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;background:#fffdfb}
.chip:hover{background:#faf5ee}
.chip b{font-size:13.5px;color:var(--c)}
.chip small{display:block;color:var(--mut);font-size:12px}
.sep{height:1px;background:#f1eae1;margin:10px 0}
#print{display:none}
@media print{
  body>*{display:none!important}
  #print{display:block!important}
  .via{page-break-after:always;border:1px dashed #444;border-radius:8px;padding:14px;margin-bottom:12px;font-family:Arial;font-size:13px}
  .via:last-child{page-break-after:auto}
  .via h2{margin:0 0 4px;font-size:16px}
  .via h3{margin:0 0 8px;font-size:14px}
  .via p{margin:6px 0;line-height:1.6}
}
.fade{animation:f .18s ease-out}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg button{white-space:nowrap}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.pg label{border:1.5px solid #ddd5cc;border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;color:var(--tx);font-size:13px;background:#fffdfb;margin:0}
.pg input{display:none}
.pg label.on{border-color:var(--c);background:#fff1f3;color:var(--c);font-weight:700}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ================= TEMA MODERNO + ANIMAÇÕES ================= */
:root{--r:18px;--glass:rgba(255,255,255,.78);--ease:cubic-bezier(.22,1,.36,1)}
body{background:#f3f1ef;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.38;pointer-events:none}
body::before{width:520px;height:520px;background:#c8102e;top:-180px;right:-140px;animation:drift 18s ease-in-out infinite alternate}
body::after{width:440px;height:440px;background:#3a3633;bottom:-160px;left:-120px;opacity:.22;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,50px) scale(1.15)}}

/* splash de abertura */
#splash{position:fixed;inset:0;background:#1e1c1b;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .55s var(--ease),visibility .55s}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:150px;border-radius:20px;animation:pop .9s var(--ease) both,glow 2s ease-in-out infinite}
#splash .ln{width:140px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#c8102e,transparent);background-size:200% 100%;animation:slide 1.1s linear infinite}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes glow{50%{filter:drop-shadow(0 0 22px rgba(200,16,46,.65))}}
@keyframes slide{to{background-position:-200% 0}}

/* cabeçalho com costura animada */
header{background:linear-gradient(120deg,#1e1c1b,#2a2523 60%,#3a1018);border-bottom:0;backdrop-filter:blur(10px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,#c8102e 0 12px,transparent 12px 20px);animation:costura 1.2s linear infinite}
@keyframes costura{to{background-position:20px 0}}
.logo{animation:glow 3.2s ease-in-out infinite;transition:transform .4s var(--ease)}
.logo:hover{transform:rotate(-6deg) scale(1.1)}
header h1 .sub{letter-spacing:.6px;text-transform:uppercase;font-size:10px}

/* cartões */
.card{border-radius:var(--r);border:1px solid rgba(30,28,27,.06);background:var(--glass);backdrop-filter:blur(8px);
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(30,28,27,.06);transition:transform .25s var(--ease),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 16px 38px rgba(200,16,46,.12)}
#modal .card:hover{transform:none}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#c8102e,#8f0b20)}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#c8102e22,transparent 70%)}
.kpi b{font-size:25px;letter-spacing:-.5px}
.os{border-left-width:6px}

/* entrada escalonada */
.rv{animation:rv .55s var(--ease) both}
@keyframes rv{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* botões */
button.b,a.b{position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(135deg,#c8102e,#9d0c24);
  box-shadow:0 4px 12px rgba(200,16,46,.28);transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
button.b:hover,a.b:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(200,16,46,.35)}
.b.wa{background:linear-gradient(135deg,#2be072,#1db954);box-shadow:0 4px 12px rgba(37,211,102,.35)}
.b.wa:hover{box-shadow:0 8px 18px rgba(37,211,102,.45)}
.b.sec{background:#fff;color:#2b2726;box-shadow:inset 0 0 0 1px #e3ddd7}
.b.sec:hover{box-shadow:inset 0 0 0 1px #c8102e,0 6px 14px rgba(0,0,0,.08)}
.b.ok{background:linear-gradient(135deg,#34b36a,#238a50);box-shadow:0 4px 12px rgba(46,158,91,.3)}
.b.er{background:linear-gradient(135deg,#e05252,#b92d2d)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(3.2);opacity:0}}
.b.wa:not(.sec){animation:wapulse 2.6s ease-in-out infinite}
@keyframes wapulse{50%{box-shadow:0 4px 12px rgba(37,211,102,.35),0 0 0 7px rgba(37,211,102,.14)}}

/* etiquetas */
.tag{border-radius:20px;padding:3px 9px}
.tag.er{background:linear-gradient(135deg,#e0334f,#c8102e);animation:tagp 2s ease-in-out infinite}
@keyframes tagp{50%{box-shadow:0 0 0 4px rgba(200,16,46,.18)}}
.tag.ok{background:linear-gradient(135deg,#34b36a,#238a50)}

/* campos */
input,select,textarea{border-radius:12px;border:1.5px solid #e3ddd7;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#c8102e;box-shadow:0 0 0 4px rgba(200,16,46,.12);background:#fff}

/* barra de ocupação com brilho */
.bar{height:14px;border-radius:14px;background:#ebe5df}
.bar i{border-radius:14px;position:relative;overflow:hidden;animation:grow .9s var(--ease) both;transform-origin:left}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  background-size:200% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes grow{from{transform:scaleX(0)}}

/* itens da fila */
.fila{border-radius:10px;transition:background .2s,padding .2s}
.fila:hover{background:#fbf3f4;padding-left:8px;padding-right:8px}
.chip{border-radius:14px;transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.chip:hover{transform:translateX(4px);border-color:#c8102e;box-shadow:0 6px 16px rgba(200,16,46,.12)}

/* modal */
#modal{backdrop-filter:blur(6px);background:rgba(20,16,14,.6)}
#modal[style*="flex"]{animation:fi .25s ease-out}
#modal[style*="flex"]>div{animation:up .4s var(--ease)}
#modal>div{border-radius:22px;border-top:4px solid #c8102e}
@keyframes fi{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(50px) scale(.96)}}

/* navegação */
nav button.on span{animation:bounce .5s var(--ease)}
@keyframes bounce{40%{transform:translateY(-6px) scale(1.2)}}
@media(max-width:819px){
  body{padding-bottom:96px}
  nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:22px;padding:5px;
    background:rgba(30,28,27,.92);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  nav button{color:#b9b1aa;border-radius:16px;padding:8px 2px;transition:background .25s,color .25s}
  nav button.on{color:#fff;background:linear-gradient(135deg,#c8102e,#8f0b20)}
  nav button.on::after{display:none}
}
@media(min-width:820px){
  nav button{transition:transform .2s var(--ease),background .2s}
  nav button:hover{transform:translateY(-2px)}
  nav button.on{background:linear-gradient(135deg,#c8102e,#8f0b20);box-shadow:0 8px 18px rgba(200,16,46,.3)}
}
::selection{background:#c8102e;color:#fff}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cbbfb5;border-radius:9px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== seletor de unidade ===== */
#unbar{max-width:1120px;margin:10px auto 0;padding:0 12px;display:flex;gap:8px;overflow-x:auto}
#unbar button{border:0;border-radius:30px;padding:8px 14px;background:#fff;font-weight:600;font-size:13px;color:#2b2726;
  box-shadow:inset 0 0 0 1px #e3ddd7;white-space:nowrap;cursor:pointer;transition:all .25s var(--ease)}
#unbar button:hover{transform:translateY(-2px)}
#unbar button.on{background:#1e1c1b;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#unbar i{font-style:normal;background:#c8102e;color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:5px}
.tag.un{background:#1e1c1b;color:#fff}
.tag.u1{background:#fff;color:#c8102e;box-shadow:inset 0 0 0 1.5px #c8102e}
.unh{border-left:6px solid #1e1c1b}.unh.u1{border-left-color:#c8102e}

/* ===== LOGIN + SINCRONIZAÇÃO (Supabase) ===== */
#login{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 500px at 85% -10%,rgba(200,16,46,.28),transparent 60%),#1e1c1b;overflow:auto}
#login[hidden]{display:none}
#login .box{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:28px 24px 24px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}
#login .lg-logo{width:96px;height:96px;object-fit:cover;border-radius:20px;display:block;margin:0 auto 16px;
  box-shadow:0 10px 28px rgba(0,0,0,.35);background:#1e1c1b}
#login .lg-logo:not([src]){visibility:hidden}
#login h1{margin:0;font-size:22px;line-height:1.2;color:#1e1c1b;letter-spacing:-.01em}
#login .lg-sub{margin:4px 0 20px;color:var(--mut);font-size:14px}
#login form{text-align:left}
#login label{display:block;font-size:13px;font-weight:600;color:var(--tx);margin:14px 0 5px}
#login .lg-campo{position:relative}
#login input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d9d2ca;border-radius:10px;
  font:inherit;font-size:16px;color:var(--tx);background:#fffdfb}
#login input:focus-visible{outline:2px solid var(--c);outline-offset:1px;border-color:var(--c)}
#login #lg-senha{padding-right:78px}
#login .lg-ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);
  font:600 13px system-ui,sans-serif;padding:8px 10px;cursor:pointer;border-radius:8px}
#login .lg-ver:focus-visible{outline:2px solid var(--c)}
#login .lg-ok{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--c);color:#fff;
  font:700 16px system-ui,sans-serif;cursor:pointer}
#login .lg-ok:hover{background:var(--c2)}
#login .lg-ok:focus-visible{outline:2px solid var(--dk);outline-offset:2px}
#login .lg-ok:disabled{opacity:.65;cursor:wait}
#login .lg-erro{margin-top:14px;min-height:18px;font-size:14px;color:var(--er);text-align:left}
#login .lg-status{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:15px;padding:6px 0 10px}
#login .lg-spin{width:18px;height:18px;border-radius:50%;border:3px solid #e6dfd8;border-top-color:var(--c);animation:lgspin .8s linear infinite}
@keyframes lgspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#login .lg-spin{animation-duration:2.4s}}
#login .lg-retry{margin-top:12px;border:1px solid #d9d2ca;background:#fff;color:var(--tx);padding:10px 16px;border-radius:10px;font:600 14px system-ui,sans-serif;cursor:pointer}

#nuvem-selo{position:fixed;right:10px;bottom:10px;z-index:9999;display:none;align-items:center;gap:10px;
  font:600 12px system-ui,sans-serif;padding:6px 6px 6px 12px;border-radius:99px;background:#fff;color:var(--mut);box-shadow:var(--sh)}
#nuvem-selo.on{display:flex}
#nuvem-selo.ok{color:var(--ok)} #nuvem-selo.er{color:var(--er)}
#nuvem-selo button{border:0;background:#f1ece7;color:var(--tx);font:600 12px system-ui,sans-serif;padding:5px 10px;border-radius:99px;cursor:pointer}
@media print{#nuvem-selo,#login{display:none!important}}
#login [hidden]{display:none!important}

/* ===== ETIQUETA 5×4 cm (adesivo para o calçado) ===== */
.etq{box-sizing:border-box;width:50mm;height:40mm;padding:2mm;display:flex;flex-direction:column;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;line-height:1.15;break-inside:avoid;page-break-after:avoid}
.etq-top{display:flex;align-items:baseline;justify-content:space-between;gap:2mm;border-bottom:.4mm solid #000;padding-bottom:1mm}
.etq-os{font-size:21pt;font-weight:900;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.etq-os small{font-size:8pt;font-weight:700;letter-spacing:0;margin-right:1mm}
.etq-un{font-size:6.5pt;font-weight:700;text-align:right;line-height:1.1}
.etq-mid{flex:1;min-height:0;overflow:hidden;padding-top:1mm;font-size:var(--fs,12pt);line-height:1.12}
.etq-mid .s{font-size:var(--fs,12pt);font-weight:800;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.12}
.etq-mid.inl .s{display:inline}
.etq-mid.inl .s+.s::before{content:' · ';font-weight:400}
.etq-mid.inl .o{display:block}
.etq-mid .o{font-size:6.5pt;margin-top:.8mm;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.etq-bot{border-top:.4mm solid #000;padding-top:.8mm;font-size:11pt;font-weight:900;line-height:1.2;white-space:nowrap}
.etq-par{font-size:11pt;font-weight:900;border:.35mm solid #000;border-radius:1mm;padding:0 1.2mm;line-height:1.25}
.etq-bot .l1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Unidades: cada uma tem horário, capacidade e numeração de OS próprios.
   Também migra dados antigos (OS sem unidade vão para a 1ª unidade). */
function migrar(){
  const c = S.config;
  if(!Array.isArray(c.unidades) || !c.unidades.length){
    c.unidades = [
      { id:'sams', nome:"Sam's Club – Galeria Beira Rio", curto:"Sam's Club", horario:c.horario,
        capacidade:c.capacidade, capacidadeSab:c.capacidadeSab||0, usaSabado:!!c.usaSabado, proxNumero:c.proxNumero||2720 },
      { id:'aventureiro', nome:'Aventureiro', curto:'Aventureiro', horario:c.horario,
        capacidade:c.capacidade, capacidadeSab:0, usaSabado:false, proxNumero:1 }
    ];
  }
  S.os.forEach(o => { if(!o.unidade || !c.unidades.some(u => u.id === o.unidade)) o.unidade = c.unidades[0].id; });
  // OS antigas (com checkboxes de serviço) viram uma OS com 1 par
  S.os.forEach(o => {
    if(Array.isArray(o.pares) && o.pares.length) return;
    const sv = o.servicos || [];
    const h0 = sv.reduce((t,x) => t + (+(c.tempos||{})[x] || 1), 0) || 1;
    const base = sv.join(' + ');
    o.pares = [{ fazer: base ? (o.item ? `${base} (${o.item})` : base) : (o.item || ''), horas:h0 }];
    o.legado = true;
  });
}
migrar();

};

const osU  = () => S.os.filter(o => U === 'todas' || o.unidade === U);
const uDef = () => U !== 'todas' ? U : (localStorage.getItem('sap_uf') || S.config.unidades[0].id);
const unTag = id => { const i = Math.max(0, S.config.unidades.findIndex(u => u.id === id));
  return `<span class="tag un u${i}">${h(UN(id).curto)}</span>`; };
function setU(id){ U = id; localStorage.setItem('sap_un', id); render(); }

/* ==================== 3. REGRAS DE NEGÓCIO / CÁLCULOS ================== */
const horasOS = o => Math.max(.25, (o.pares||[]).reduce((t,p) => t + (+p.horas || +C().tempoPar || 1), 0) || 1);
const itemMsg = o => (o.legado && o.item) ? o.item : 'conserto';   // texto usado nas mensagens de WhatsApp
const parTxt  = p => h(p.fazer||'').replace(/\n/g, ' + ');
const parLista = o => { const ps = o.pares||[];
  return ps.map((p,i) => `${ps.length>1 ? `<b>Par ${i+1}:</b> ` : ''}${parTxt(p)} <span style="color:var(--mut)">(${+p.horas||0}h)</span>`).join('<br>'); };
const pago    = o => (o.pagamentos||[]).reduce((t,p) => t + (+p.valor||0), 0);
const saldo   = o => Math.max(0, (+o.valor||0) - (+o.desconto||0) - pago(o));
const ABERTOS = ['Recebido','Em fila','Em execução'];
const FLUXO   = ['Recebido','Em fila','Em execução','Pronto','Entregue'];
const aberta  = o => ABERTOS.includes(o.status);
const atrasada= o => aberta(o) && o.prazo < hoje();
const prontoEm= o => { const e = [...(o.historico||[])].reverse().find(x => x.para === 'Pronto'); return e ? e.data : null; };
const avisado = o => (o.avisos||[]).some(a => ['pronto','lembrete'].includes(a.tipo));
const semAviso= o => o.status === 'Pronto' && !avisado(o);
const parado  = o => o.status === 'Pronto' && (prontoEm(o) ? diasEntre(prontoEm(o), agora()) >= C().diasParado : false);
const diasParadoQtd = o => prontoEm(o) ? diasEntre(prontoEm(o), agora()) : 0;
const promessaVencida = o => o.promessa && o.promessa < hoje() && saldo(o) > 0;
const devendo = o => ['Pronto','Entregue'].includes(o.status) && saldo(o) > 0;
const proximo = o => { const i = FLUXO.indexOf(o.status); return (i >= 0 && i < FLUXO.length - 1) ? FLUXO[i+1] : null; };

/* Capacidade de produção de um dia: sábado segue a configuração; domingo não produz. */
function capDoDia(dia, uid){
  const u = UN(uid), w = dow(dia);
  if(w === 0) return 0;                                   // domingo: fechado
  if(w === 6) return u.usaSabado ? (+u.capacidadeSab || 0) : 0;   // sábado: só se habilitado na unidade
  return +u.capacidade || 8;
}
/* ------------------- PROGRAMAÇÃO DE PRODUÇÃO ---------------------------
   Ordena a fila (urgentes primeiro, depois prazo, depois nº da OS) e
   distribui as horas de cada OS nos dias úteis respeitando a capacidade.
   Grava a previsão de execução (_prev) e o detalhamento por dia (dias). */
function programar(uid){
  // Cada unidade tem a sua própria fila e capacidade. Sem argumento: calcula todas.
  const ids = uid ? [uid] : S.config.unidades.map(u => u.id);
  let res = { fila:[], dias:{}, cap:0 };
  ids.forEach(id => {
    const fila = S.os.filter(o => aberta(o) && o.unidade === id).sort((a,b) =>
        (a.prioridade === 'urgente' ? 0 : 1) - (b.prioridade === 'urgente' ? 0 : 1)
     || a.prazo.localeCompare(b.prazo)
     || a.numero - b.numero);
    const dias = {};
    let d = hoje(), uso = 0;
    fila.forEach(o => {
      const cap = capDoDia(d, id);
      if(cap - uso <= 0.001){ d = addDia(d,1); uso = 0; }
      let D = d, Uu = uso, rest = horasOS(o), g = 0;
      o._prev = null;
      while(rest > 0.001 && g++ < 400){
        const c = capDoDia(D, id);
        if(c <= 0.001 || c - Uu <= 0.001){ D = addDia(D,1); Uu = 0; continue; }
        const t = Math.min(rest, c - Uu);
        (dias[D] = dias[D] || []).push({ o, h:t });
        if(o._prev === null) o._prev = D;
        Uu += t; rest -= t;
      }
      d = D; uso = Uu;
      if(g > 380) o._prev = o._prev || d;
    });
    res = { fila, dias, cap: capDoDia(hoje(), id) };
  });
  return res;
}const risco = o => aberta(o) && !atrasada(o) && o._prev && o._prev > o.prazo;

/* ==================== 4. CANAL DE ENVIO (WhatsApp / API) ===============
   Toda mensagem passa por aqui. Para migrar para envio automático por API
   (Meta Cloud API, Z-API, Twilio etc.), basta reescrever Canal.enviar():
   troque o window.open por um fetch(...) e retorne true quando o envio
   for confirmado. Nada mais no sistema precisa mudar. */
function fone(t){
  let n = String(t||'').replace(/\D/g,'');
  n = n.replace(/^0+/,'');
  if(n.startsWith('55') && n.length > 11) n = n.slice(2);   // remove DDI repetido
  return '55' + n;                                          // DDI Brasil + DDD + número
}
function montar(o, tipo){
  const tpl = (C().msgs[tipo] || '');
  const vals = {
    nome: (o.cliente||'').trim().split(/\s+/)[0] || '',
    item:itemMsg(o), numero:o.numero,
    horario:unid(o).horario, loja:C().loja + ' – ' + unid(o).curto, unidade:unid(o).curto,
    valor:R(o.valor), saldo:R(saldo(o)), pago:R(pago(o)),
    prazoPag:o.promessa ? fd(o.promessa) : 'a combinar',
    prontoEm: prontoEm(o) ? fdt(prontoEm(o)) : '—',
    situacaoPag: saldo(o) <= 0.009 ? 'Pagamento já quitado ✅'
      : (pago(o) > 0 ? `Entrada de ${R(pago(o))} já recebida. Saldo na retirada: ${R(saldo(o))}.` : `Pagamento na retirada: ${R(saldo(o))}.`)
  };
  return tpl.replace(/\{(\w+)\}/g, (_, k) => (vals[k] ?? ''));
}
const Canal = {
  enviar(o, tipo, texto){
    // ↑↑ PONTO ÚNICO DE MUDANÇA PARA API ↑↑
    window.open('https://wa.me/' + fone(o.telefone) + '?text=' + encodeURIComponent(texto), '_blank');
    return true;
  }
};
function avisar(id, tipo){
  const o = get(id); if(!o) return;
  if(Canal.enviar(o, tipo, montar(o, tipo))){
    (o.avisos = o.avisos || []).push({ data:agora(), tipo });
    o.historico.push({ data:agora(), de:o.status, para:o.status, nota:`Cliente avisado no WhatsApp (${tipo})` });
    save(); render();
  }
}

/* ============================ 5. STATUS =============================== */
function mudar(id, novo){
  const o = get(id); if(!o) return;
  if(novo === 'Entregue' && saldo(o) > 0 && !confirm(`Ainda há saldo de ${R(saldo(o))}. Entregar mesmo assim?`)) return;
  if(novo === 'Cancelado' && !confirm('Cancelar esta OS? O histórico será mantido.')) return;
  o.historico.push({ data:agora(), de:o.status, para:novo, nota:'' });
  o.status = novo; save(); render();
  if(novo === 'Pronto') detalhe(id);        // ao ficar pronto: já abre com o botão de aviso
}

/* ======================= 7. CARTÃO DA OS (lista) ====================== */
function tagsOS(o){
  const t = [unTag(o.unidade)];
  if(o.prioridade === 'urgente') t.push('<span class="tag er">URGENTE</span>');
  if(atrasada(o)) t.push('<span class="tag er">ATRASADA</span>');
  else if(risco(o)) t.push('<span class="tag am">EM RISCO</span>');
  if(o.status !== 'Cancelado' && (+o.valor||0) > 0){
    if(saldo(o) <= 0.009) t.push('<span class="tag ok">PAGO</span>');
    else if(pago(o) > 0) t.push(`<span class="tag ok">ENTRADA ${R(pago(o))}</span>`);
  }
  if(semAviso(o)) t.push('<span class="tag am">SEM AVISO</span>');
  if(parado(o)) t.push(`<span class="tag er">PARADO ${diasParadoQtd(o)}d</span>`);
  if(o.status !== 'Cancelado' && saldo(o) > 0)
    t.push(`<span class="tag ${o.status==='Entregue'?'cb':'am'}">SALDO ${R(saldo(o))}</span>`);
  if(promessaVencida(o)) t.push('<span class="tag er">PROMESSA VENCIDA</span>');
  return t.join('');
}
function cartao(o){
  const p = proximo(o);
  const av = avisado(o);
  return `<div class="card os ${o.prioridade==='urgente'?'urg':''} ${atrasada(o)?'atr':risco(o)?'risco':''} fade">
    <b>#${o.numero} · ${h(o.item)}</b> <span class="tag">${h(o.status)}</span><br>${tagsOS(o)}
    <div class="hint" style="margin-top:6px">
      ${h(o.cliente)} · ${h(o.telefone)}<br>
      Prazo ${fd(o.prazo)}${aberta(o)&&o._prev?` · previsão <b>${fd(o._prev)}</b>`:''}
      ${o.responsavel?' · '+h(o.responsavel):''}
    </div>
    ${p?`<button class="b" onclick="mudar(${o.id},'${p}')">→ ${p}</button>`:''}
    ${o.status==='Pronto'?`<button class="b wa" onclick="avisar(${o.id},'${av?'lembrete':'pronto'}')">📲 ${av?'Reenviar lembrete':'Avisar no WhatsApp'}</button>`:''}
    <button class="b sec" onclick="detalhe(${o.id})">Detalhes</button>
  </div>`;
}

/* ============================ 8. INÍCIO =============================== */
function vInicio(){
  const t = osU(), lim = addDia(hoje(), -30);
  const prontas  = t.filter(o => o.status === 'Pronto');
  const entregues= t.filter(o => o.status === 'Entregue');
  const ult30    = entregues.filter(o => (o.historico.slice(-1)[0]?.data || '').slice(0,10) >= lim);

  // Tempo médio da entrada até ficar pronta (em horas)
  const tempos = t.map(o => { const p = prontoEm(o); return p ? (new Date(p) - new Date(o.criada || o.historico[0].data)) / 36e5 : null; })
                   .filter(x => x !== null && x >= 0);
  const media = tempos.length ? tempos.reduce((a,b) => a+b, 0) / tempos.length : 0;

  // Faturamento = valor RECEBIDO nos últimos 30 dias (pagamentos registrados)
  const recebido30 = t.reduce((s,o) => s + (o.pagamentos||[])
      .filter(p => (p.data||'').slice(0,10) >= lim).reduce((a,p) => a + (+p.valor||0), 0), 0);
  const aReceber = t.filter(o => o.status !== 'Cancelado').reduce((s,o) => s + saldo(o), 0);
  const valorAberto = t.filter(aberta).reduce((s,o) => s + (+o.valor||0), 0);

  // Produção por responsável
  const prod = {};
  t.filter(o => ['Pronto','Entregue'].includes(o.status)).forEach(o => {
    const r = o.responsavel || '(sem responsável)';
    prod[r] = prod[r] || { n:0, h:0, v:0 };
    prod[r].n++; prod[r].h += horasOS(o); prod[r].v += (+o.valor||0);
  });

  const alertas = [
    ...t.filter(atrasada).map(o => `⏰ OS #${o.numero} atrasada (prazo ${fd(o.prazo)}) — ${h(o.cliente)}`),
    ...t.filter(risco).map(o => `⚠️ OS #${o.numero} em risco: previsão ${fd(o._prev)}, prazo ${fd(o.prazo)}`),
    ...t.filter(parado).map(o => `📦 OS #${o.numero} pronta há ${diasParadoQtd(o)} dias sem retirada`),
    ...t.filter(promessaVencida).map(o => `💸 OS #${o.numero}: promessa de pagamento era ${fd(o.promessa)}`)
  ];

  const porUn = S.config.unidades.map(u => { const x = t.filter(o => o.unidade === u.id);
    return { u, ab:x.filter(aberta).length, at:x.filter(atrasada).length, pr:x.filter(o => o.status === 'Pronto').length,
      rec:x.reduce((s,o) => s + (o.pagamentos||[]).filter(p => (p.data||'').slice(0,10) >= lim).reduce((a,p) => a + (+p.valor||0), 0), 0) }; });
  const k = (n,l) => `<div class="card kpi"><b>${n}</b><small>${l}</small></div>`;

  $app.innerHTML = `
  <div class="grid">
    ${k(t.filter(aberta).length,'OS abertas')}
    ${k(t.filter(atrasada).length,'Atrasadas')}
    ${k(prontas.length,'Prontas p/ retirar')}
    ${k(media ? media.toFixed(1)+' h' : '—','Tempo médio até ficar pronta')}
    ${k(ult30.length,'Entregas (30 dias)')}
    ${k(R(recebido30),'Recebido (30 dias)')}
    ${k(R(aReceber),'A receber')}
    ${k(R(valorAberto),'Valor em produção')}
    ${k(inativos().length,'Clientes para reativar')}
  </div>
  <div class="card"><h3>🔔 Alertas</h3>
    ${alertas.length ? alertas.map(a => `<div class="hint" style="padding:3px 0">${a}</div>`).join('') : '<div class="hint">Tudo em dia ✅</div>'}
  </div>
  <div class="card"><h3>📲 Prontos sem aviso</h3>
    ${t.filter(semAviso).map(cartao).join('') || '<div class="hint">Nenhum cliente pendente de aviso.</div>'}
  </div>
  ${U === 'todas' ? `<div class="card"><h3>🏬 Por unidade</h3>
    ${porUn.map(x => `<div class="fila" onclick="setU('${x.u.id}')"><span>${unTag(x.u.id)} <b>${h(x.u.nome)}</b></span>
      <span class="hint">${x.ab} abertas · ${x.at} atrasadas · ${x.pr} prontas · ${R(x.rec)} em 30d</span></div>`).join('')}
  </div>` : ''}
  <div class="card"><h3>👷 Produção por responsável</h3>
    ${Object.entries(prod).sort((a,b)=>b[1].n-a[1].n).map(([r,v]) =>
      `<div class="fila" style="cursor:default"><span>${h(r)}</span>
       <span><b>${v.n}</b> OS · ${v.h.toFixed(1)} h · ${R(v.v)}</span></div>`).join('') || '<div class="hint">Sem dados ainda.</div>'}
  </div>`;
}

/* ============================ 9. LISTA DE OS ========================== */
function filtroOS(){
  const q = F.q.trim().toLowerCase(), qd = F.q.replace(/\D/g,'');
  return osU().filter(o => {
    const okQ = !q
      || o.cliente.toLowerCase().includes(q)
      || o.item.toLowerCase().includes(q)
      || String(o.numero) === q
      || (qd.length >= 3 && String(o.telefone||'').replace(/\D/g,'').includes(qd));
    const okS = !F.st || o.status === F.st;
    const okF = (F.f === '' ) || (F.f === 'atr' && atrasada(o)) || (F.f === 'sem' && semAviso(o))
             || (F.f === 'dev' && devendo(o)) || (F.f === 'urg' && o.prioridade === 'urgente');
    return okQ && okS && okF;
  }).sort((a,b) => b.numero - a.numero);
}
function vOS(){
  $app.innerHTML = `
  <div class="card">
    <input id="busca" placeholder="🔍 Buscar por cliente, item, nº da OS ou telefone" value="${h(F.q)}"
           oninput="F.q=this.value;vOSLista()">
    <div class="row">
      <select onchange="F.st=this.value;vOSLista()">
        <option value="">Todos os status</option>
        ${[...FLUXO,'Cancelado'].map(s => `<option ${F.st===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select onchange="F.f=this.value;vOSLista()">
        <option value="">Sem filtro especial</option>
        <option value="atr" ${F.f==='atr'?'selected':''}>Atrasadas</option>
        <option value="sem" ${F.f==='sem'?'selected':''}>Prontos sem aviso</option>
        <option value="dev" ${F.f==='dev'?'selected':''}>Com saldo a receber</option>
        <option value="urg" ${F.f==='urg'?'selected':''}>Urgentes</option>
      </select>
    </div>
  </div>
  <div id="lista"></div>`;
  vOSLista();
}

  document.getElementById('lista').innerHTML =

/* ========================== 10. PROGRAMAÇÃO =========================== */
function blocoProg(u){
  const { dias, fila } = programar(u.id);
  const ks = Object.keys(dias).sort();
  const prev = fila.filter(o => o._prev).slice(0,10);
  const i = Math.max(0, S.config.unidades.findIndex(x => x.id === u.id));
  return `
  <div class="card unh u${i}">
    <h3>🗓️ ${h(u.nome)}</h3>
    <div class="hint">Capacidade: <b>${+u.capacidade||8} h/dia</b> (seg a sex) ·
      ${u.usaSabado ? `sábado ${(+u.capacidadeSab||0)} h` : 'sábado sem produção (só atendimento)'} ·
      fila: urgentes primeiro, depois por prazo.</div>
    <div class="sep"></div>
    <b style="font-size:13.5px;color:var(--c)">Ordem da fila (${fila.length})</b>
    ${prev.map((o,n) => `<div class="fila" onclick="detalhe(${o.id})">
        <span>${n+1}. ${o.prioridade==='urgente'?'🔴':'⚪'} #${o.numero} ${h(o.item)}</span>
        <span class="hint">${horasOS(o).toFixed(1)} h · ${fd(o._prev)}</span></div>`).join('')
      || '<div class="hint">Fila vazia 🎉</div>'}
    ${fila.length > prev.length ? `<div class="hint">+ ${fila.length-prev.length} OS na sequência</div>` : ''}
  </div>
  ${ks.map(d => {
    const usada = dias[d].reduce((s,x) => s + x.h, 0);
    const c = capDoDia(d, u.id), p = c > 0 ? Math.min(100, usada / c * 100) : 0;
    const cls = p > 95 ? 'f' : p > 75 ? 'w' : '';
    return `<div class="card">
      <b>${fd(d)}</b> ${d===hoje()?'<span class="tag ok">HOJE</span>':''} ${dow(d)===6?'<span class="tag">sábado · atendimento</span>':''}
      <div class="bar"><i class="${cls}" style="width:${p}%"></i></div>
      <div class="hint">${usada.toFixed(1)} h de ${c} h ocupadas (${p.toFixed(0)}%)</div>
      ${dias[d].map(({o,h:hh}) => `<div class="fila" onclick="detalhe(${o.id})">
          <span>${o.prioridade==='urgente'?'🔴':'⚪'} #${o.numero} ${h(o.item)}</span>
          <span class="hint">${hh.toFixed(1)} h · prazo ${fd(o.prazo)}
          ${o.prazo < d ? ' <span class="tag er">passa do prazo</span>' : ''}</span></div>`).join('')}
    </div>`;
  }).join('') || '<div class="card">Nada programado: a fila está vazia.</div>'}`;
}

      <b>#${o.numero} · ${h(o.item)}</b> <span class="tag ${o.status==='Entregue'?'cb':''}">${o.status}</span><br>
      <div class="hint">${h(o.cliente)} · ${h(o.telefone)}${o.promessa?` · promessa ${fd(o.promessa)}`:''}<br>

/* ================= 12. DETALHE DA OS / PAGAMENTO / NEGOCIAÇÃO ======== */
function modal(html){ $mbox.innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
function fechar(){ document.getElementById('modal').style.display = 'none'; }

function detalhe(id){
  const o = get(id); if(!o) return;
  programar();
  const av = avisado(o);

  const hist = (o.historico||[]).slice().reverse().map(x =>

    </div>`).join('');

  const pags = (o.pagamentos||[]).map(p =>
    `<div class="hint">${fdt(p.data)} · <b>${R(p.valor)}</b> · ${h(p.forma)}</div>`).join('');

  modal(`

    <b>Saldo ${R(saldo(o))}</b>${o.promessa?` · Promessa ${fd(o.promessa)}`:''}</div>

  <h4>Fluxo</h4>
  ${proximo(o) ? `<button class="b" onclick="mudar(${o.id},'${proximo(o)}');fechar()">→ Avançar para ${proximo(o)}</button>` : ''}
  ${o.status === 'Pronto' ? `<button class="b wa" onclick="avisar(${o.id},'${av?'lembrete':'pronto'}')">📲 ${av?'Reenviar lembrete':'Avisar no WhatsApp'}</button>` : ''}
  ${(o.avisos||[]).length ? `<div class="hint">${o.avisos.map(a => `Cliente avisado (${a.tipo}) em ${fdt(a.data)}`).join('<br>')}</div>` : ''}

  <h4>💰 Receber pagamento</h4>
  <div class="row3">
    <div><label>Valor (R$)</label><input id="pv" type="number" step="0.01" inputmode="decimal" value="${saldo(o).toFixed(2)}"></div>
    <div><label>Forma</label>
      <select id="pf"><option>Pix</option><option>Dinheiro</option><option>Cartão débito</option><option>Cartão crédito</option><option>Transferência</option></select></div>
    <div><label>&nbsp;</label><button class="b ok" style="width:100%" onclick="receber(${o.id})">Registrar</button></div>
  </div>
  <button class="b sec sm" onclick="document.getElementById('pv').value='${saldo(o).toFixed(2)}'">Quitar saldo</button>
  <button class="b sec sm" onclick="document.getElementById('pv').value='${(saldo(o)/2).toFixed(2)}'">Metade do saldo</button>

  <h4>🤝 Negociação</h4>
  <div class="row3">
    <div><label>Desconto (R$)</label><input id="pd" type="number" step="0.01" inputmode="decimal" value="${o.desconto||0}"></div>

  </div>
  <div style="display:flex;flex-wrap:wrap">
    ${SITUACOES.slice(2).map(s => `<button class="b wa sm" onclick="avisar(${o.id},'${s[0]}')">${s[1]}</button>`).join('')}
  </div>

  ${(o.pares||[]).length>1 ? o.pares.map((_,i) => `<button class="b sec sm" onclick="imprimirEtiqueta(${o.id},${i})">🏷️ Par ${i+1}</button>`).join('') : ''}

function receber(id){
  const o = get(id), v = +document.getElementById('pv').value;
  if(!(v > 0)) return alert('Informe um valor válido.');
  (o.pagamentos = o.pagamentos || []).push({ data:agora(), valor:v, forma:document.getElementById('pf').value });
  o.historico.push({ data:agora(), de:o.status, para:o.status, nota:`Pagamento de ${R(v)} (${document.getElementById('pf').value})` });
  if(saldo(o) <= 0.009) o.promessa = '';
  save(); render(); detalhe(id);
}
function negociar(id){
  const o = get(id);
  o.desconto = +document.getElementById('pd').value || 0;
  o.promessa = document.getElementById('pp').value || '';
  o.historico.push({ data:agora(), de:o.status, para:o.status,
    nota:`Negociação: desconto ${R(o.desconto)}${o.promessa?`, promessa para ${fd(o.promessa)}`:', sem data de promessa'}` });
  save(); render(); detalhe(id);
}

/* ============ 13. FORMULÁRIO DE OS (criar / editar, nº editável) ===== */
let PARES = [], PAR_ATIVO = 0;
function renderPares(){
  const box = document.getElementById('pares'); if(!box) return;
  const p = PARES[PAR_ATIVO], n = PARES.length;
  box.innerHTML = `
  <div class="seg">
    ${PARES.map((x,i) => `<button type="button" class="b sm ${i===PAR_ATIVO?'':'sec'}" onclick="parSel(${i})">Par ${i+1}</button>`).join('')}
    <button type="button" class="b sm ok" onclick="parAdd()">+ Par</button>
  </div>
  <label style="margin-top:8px">O que fazer${n>1 ? ` no par ${PAR_ATIVO+1} de ${n}` : ''} <span style="font-weight:400">(uma tarefa por linha — sai na etiqueta)</span></label>
  <textarea id="fz" placeholder="ex.: trocar meia-sola&#10;costurar o bico" oninput="PARES[PAR_ATIVO].fazer=this.value">${h(p.fazer)}</textarea>
  <div class="row">
    <div><label>Tempo previsto (h)</label><input id="fh" type="number" step="0.25" min="0.25" inputmode="decimal" value="${p.horas}" oninput="PARES[PAR_ATIVO].horas=+this.value||0"></div>
    <div>${n>1 ? `<label>&nbsp;</label><button type="button" class="b er" style="width:100%;margin:3px 0 9px" onclick="parDel()">Remover este par</button>` : ''}</div>
  </div>`;
}
function parSel(i){ PAR_ATIVO = i; renderPares(); }
function parAdd(){ PARES.push({ fazer:'', horas:+C().tempoPar || 1 }); PAR_ATIVO = PARES.length - 1; renderPares();
  const t = document.getElementById('fz'); if(t) t.focus(); }
function parDel(){
  if(PARES.length < 2) return;
  if((PARES[PAR_ATIVO].fazer||'').trim() && !confirm(`Remover o par ${PAR_ATIVO+1}?`)) return;
  PARES.splice(PAR_ATIVO, 1); PAR_ATIVO = Math.max(0, PAR_ATIVO - 1); renderPares();
}
function formOS(id){
  const o = id ? get(id) : {
    unidade:uDef(), numero:UN(uDef()).proxNumero, entrada:hoje(), prazo:addDia(hoje(),3),
    pares:[], prioridade:'normal', valor:'', desconto:0
  };
  PARES = (o.pares||[]).map(p => ({ fazer:p.fazer||'', horas:+p.horas || +C().tempoPar || 1 }));
  if(!PARES.length) PARES = [{ fazer:'', horas:+C().tempoPar || 1 }];
  PAR_ATIVO = 0;
  modal(`
  <h3>${id ? 'Editar' : 'Nova'} Ordem de Serviço</h3>
  <label>🏬 Unidade</label>
  <div class="pg" id="pu" data-new="${id ? '' : '1'}" style="grid-template-columns:1fr 1fr">
    ${C().unidades.map(u => `<label class="${u.id===o.unidade?'on':''}"><input type="radio" name="fu" value="${u.id}" ${u.id===o.unidade?'checked':''} onchange="unSel()">🏬 ${h(u.curto)}</label>`).join('')}
  </div>
  <label>Número da OS (editável · a numeração é separada por unidade)</label>
  <input id="fn" type="number" min="1" inputmode="numeric" value="${o.numero}">
  <div class="row">
    <div><label>Cliente</label><input id="fc" value="${h(o.cliente||'')}"></div>
    <div><label>Telefone com DDD</label><input id="ft" type="tel" inputmode="tel" placeholder="(11) 99999-9999" value="${h(o.telefone||'')}"></div>
  </div>
  <div class="row">
    <div><label>Data de entrada</label><input id="fe" type="date" value="${o.entrada}"></div>
    <div><label>Prazo prometido</label><input id="fp" type="date" value="${o.prazo}"></div>
  </div>
  <label>🔧 Conserto — um par por aba</label>
  <div id="pares"></div>
  <div class="row3">
    <div><label>Valor (R$)</label><input id="fv" type="number" step="0.01" inputmode="decimal" value="${o.valor}" oninput="if(document.getElementById('pgr'))pgSel()"></div>
    <div><label>Prioridade</label><select id="fpr"><option>normal</option><option ${o.prioridade==='urgente'?'selected':''}>urgente</option></select></div>
    <div><label>Responsável</label><input id="fr" value="${h(o.responsavel||'')}"></div>
  </div>
  ${id ? '' : `<label>💰 Pagamento na entrada</label>
  <div class="pg" id="pg">
    <label class="on"><input type="radio" name="pgt" value="nenhum" checked onchange="pgSel()">⏳ Paga na retirada</label>
    <label><input type="radio" name="pgt" value="entrada" onchange="pgSel()">💵 Deu entrada</label>
    <label><input type="radio" name="pgt" value="total" onchange="pgSel()">✅ Pagou tudo</label>
  </div>
  <div id="pgx" class="row" style="display:none">
    <div id="pgv"><label>Valor da entrada (R$)</label><input id="fev" type="number" step="0.01" inputmode="decimal" oninput="pgSel()"></div>
    <div><label>Forma</label><select id="fef"><option>Pix</option><option>Dinheiro</option><option>Cartão débito</option><option>Cartão crédito</option><option>Transferência</option></select></div>
  </div>
  <div class="hint" id="pgr" style="margin-bottom:8px"></div>`}
  <label>Observações</label><textarea id="fo">${h(o.obs||'')}</textarea>
  ${id ? '' : `<label style="display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600;cursor:pointer"><input type="checkbox" id="fetq" style="width:auto;margin:0" ${localStorage.getItem('sap_etq') !== '0' ? 'checked' : ''}>🏷️ Imprimir etiqueta 5×4 cm ao salvar</label>`}
  <button class="b" onclick="salvarOS(${id||0})">Salvar OS</button>
  <button class="b sec" onclick="fechar()">Cancelar</button>`);
  renderPares();
}
function salvarOS(id){
  const n   = +document.getElementById('fn').value;
  const tel = document.getElementById('ft').value.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'').replace(/^0+/,'');
  const cli = document.getElementById('fc').value.trim();
  const pares = PARES.map(p => ({ fazer:(p.fazer||'').trim(), horas:+p.horas || +C().tempoPar || 1 }));
  const vazio = pares.findIndex(p => !p.fazer);
  const it  = pares.map(p => p.fazer.replace(/\s*\n\s*/g, ' + ')).join(' | ');
  const fe  = document.getElementById('fe').value;
  const fp  = document.getElementById('fp').value;
  const un  = (document.querySelector('input[name=fu]:checked') || {}).value || uDef();

  if(!cli) return alert('Preencha o nome do cliente.');
  if(vazio >= 0){ PAR_ATIVO = vazio; renderPares(); return alert(`Descreva o que fazer no par ${vazio+1}.`); }
  if(tel.length < 10 || tel.length > 11) return alert('Telefone inválido. Use DDD + número, ex.: (11) 99999-9999.');
  if(!(n > 0)) return alert('Informe um número de OS válido.');
  if(S.os.some(x => x.numero === n && x.id !== id && x.unidade === un)) return alert('Já existe uma OS com esse número nesta unidade.');
  if(fp && fe && fp < fe) return alert('O prazo não pode ser anterior à data de entrada.');

  const dados = {
    unidade:un, numero:n, cliente:cli, telefone:document.getElementById('ft').value.trim(),
    entrada:fe, prazo:fp, item:it,
    pares, legado:false,
    valor:+document.getElementById('fv').value || 0,
    prioridade:document.getElementById('fpr').value,
    responsavel:document.getElementById('fr').value.trim(),
    obs:document.getElementById('fo').value.trim()
  };
  const querEtq = !id && !!(document.getElementById('fetq') || {}).checked;
  if(!id) localStorage.setItem('sap_etq', querEtq ? '1' : '0');
  const idNovo = Date.now();

  if(id){
    const o = get(id);
    Object.assign(o, dados);
    o.historico.push({ data:agora(), de:o.status, para:o.status, nota:'OS editada' });
  } else {
    // Pagamento informado na abertura da OS: nenhum, entrada parcial ou total
    const tp = (document.querySelector('input[name=pgt]:checked') || {}).value || 'nenhum';
    const forma = document.getElementById('fef').value;
    const pags = [], hist = [{ data:agora(), de:'', para:'Recebido', nota:'OS criada' }];
    if(tp === 'entrada'){
      const v = +document.getElementById('fev').value;
      if(!(v > 0) || v > dados.valor) return alert('Informe uma entrada maior que zero e que não ultrapasse o valor da OS.');
      pags.push({ data:agora(), valor:v, forma });
      hist.push({ data:agora(), de:'Recebido', para:'Recebido', nota:`Entrada de ${R(v)} (${forma})` });
    }
    if(tp === 'total'){
      if(!(dados.valor > 0)) return alert('Informe o valor da OS para registrar o pagamento total.');
      pags.push({ data:agora(), valor:dados.valor, forma });
      hist.push({ data:agora(), de:'Recebido', para:'Recebido', nota:`Pagamento total de ${R(dados.valor)} (${forma})` });
    }
    S.os.push(Object.assign({ id:idNovo, status:'Recebido', criada:agora(),
      desconto:0, pagamentos:pags, avisos:[], historico:hist }, dados));
    if(n >= UN(un).proxNumero) UN(un).proxNumero = n + 1;   // a sequência da unidade continua a partir daqui
    localStorage.setItem('sap_uf', un);
  }
  save(); fechar(); render();
  if(!id && querEtq) imprimirEtiqueta(idNovo);
}

/* ================= 14. IMPRESSÃO (via cliente + via produção) ======== */
function imprimir(id){
  limparEtiqueta();
  const o = get(id);
  const linha = (r,v) => `<p><b>${r}:</b> ${h(v||'—')}</p>`;
  const via = t => {
    const prod = t.includes('produção');
    return `<div class="via">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><img src="${LOGO}" style="height:50px;background:#1e1c1b;border-radius:6px"><h2 style="margin:0">${h(C().loja)} · ${h(unid(o).curto)} — ${t}</h2></div>
      <h3>Ordem de Serviço nº ${o.numero}</h3>
      ${linha('Cliente', o.cliente)}${linha('Telefone', o.telefone)}
      ${(o.pares||[]).map((p,i) => linha((o.pares.length>1 ? 'Par ' + (i+1) + ' – ' : '') + 'O que fazer', (p.fazer||'').replace(/\n/g, ' + '))).join('')}
      ${linha('Entrada', fd(o.entrada))}${linha('Prazo prometido', fd(o.prazo))}
      ${linha('Prioridade', o.prioridade.toUpperCase())}
      ${prod
        ? linha('Responsável', o.responsavel) + linha('Tempo previsto', horasOS(o).toFixed(1) + ' h') + linha('Status', o.status)
        : linha('Valor', R(o.valor)) + linha('Desconto', R(o.desconto||0)) + linha('Pago', R(pago(o))) + linha('Saldo', R(saldo(o))) + linha('Situação do pagamento', saldo(o) <= 0.009 ? 'PAGO' : (pago(o) > 0 ? 'ENTRADA PAGA' : 'PAGAR NA RETIRADA'))}
      ${linha('Observações', o.obs)}
      ${prod ? '' : `<p><b>Retirada:</b> ${h(unid(o).horario)}</p>
        <p style="margin-top:14px">Assinatura do cliente: ______________________________</p>`}
      <p style="font-size:11px;color:#555">Emitido em ${fdt(agora())}</p>
    </div>`;
  };
  document.getElementById('print').innerHTML = via('Via do cliente') + via('Via da produção');
  fechar();
  setTimeout(() => window.print(), 60);
}

/* ================= 14C. ETIQUETA 5×4 cm (adesivo para o calçado) ========
   Uma etiqueta por PAR. Mostra só: nº da OS (grande), o que fazer naquele par
   e o prazo de entrega. Se a OS tem vários pares, mostra também "1/3". */
function htmlEtiqueta(o, i){
  const ps = o.pares || [], p = ps[i] || { fazer:'' };
  const prazo = o.prazo ? fd(o.prazo).slice(0,5) : '—';
  const linhas = (p.fazer||'').split(/\n+/).map(x => x.trim()).filter(Boolean);
  const servs = linhas.length ? linhas.map(x => `<div class="s">${h(x)}</div>`).join('') : '<div class="s">—</div>';
  return `<div class="etq">
    <div class="etq-top"><span class="etq-os"><small>OS</small>${h(o.numero)}</span>${ps.length>1 ? `<span class="etq-par">${i+1}/${ps.length}</span>` : ''}</div>
    <div class="etq-mid">${servs}</div>
    <div class="etq-bot">Prazo: ${prazo}</div>
  </div>`;
}
/* Monta fora da tela e diminui a letra até caber nos 4 cm de altura. */
function etiquetaPronta(o, i){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:-10000px;top:0;visibility:hidden';
  t.innerHTML = htmlEtiqueta(o, i);
  document.body.appendChild(t);
  const mid = t.querySelector('.etq-mid');
  const cabeAgora = () => mid.scrollHeight <= mid.clientHeight + 1;
  const reduzir = (ini, min) => { let fs = ini; mid.style.setProperty('--fs', fs + 'pt');
    while(!cabeAgora() && fs > min){ fs -= .5; mid.style.setProperty('--fs', fs + 'pt'); } };
  reduzir(16, 8);                                   // 1º: uma tarefa por linha
  if(!cabeAgora()){ mid.classList.add('inl'); reduzir(11, 6); }   // 2º: tarefas lado a lado
  const cabe = cabeAgora();
  const html = t.innerHTML;
  t.remove();
  return { html, cabe };
}
function limparEtiqueta(){
  const st = document.getElementById('etq-page'); if(st) st.remove();
  document.body.classList.remove('etq-mode');
}
/* Sem idx: imprime uma etiqueta para CADA par da OS. Com idx: só aquele par. */
function imprimirEtiqueta(id, idx){
  const o = get(id); if(!o) return;
  const idxs = idx == null ? (o.pares||[]).map((_, i) => i) : [idx];
  if(!idxs.length) return alert('Esta OS não tem nenhum par cadastrado.');
  const rs = idxs.map(i => etiquetaPronta(o, i));
  if(rs.some(r => !r.cabe) && !confirm('O texto de alguma etiqueta não cabe inteiro nos 5×4 cm e será cortado. Imprimir mesmo assim?')) return;
  document.getElementById('print').innerHTML = rs.map(r => r.html).join('');
  const st = document.createElement('style');           // tamanho de página só durante a etiqueta
  st.id = 'etq-page';
  st.textContent = '@page{size:50mm 40mm;margin:0}';
  document.head.appendChild(st);
  document.body.classList.add('etq-mode');
  fechar();
  window.addEventListener('afterprint', limparEtiqueta, { once:true });
  setTimeout(() => window.print(), 60);
}

/* ============ 14B. PAGAMENTO NA ABERTURA DA OS (apoio do formulário) ===== */
/* Troca de unidade no formulário: sugere o próximo número daquela unidade (só em OS nova). */
function unSel(){

/* ============ 14C. RELACIONAMENTO COM CLIENTES ==========================
   Agrupa as OS por telefone e mostra: inativos (sumiram), esfriando,
   pós-venda (entregues há poucos dias) e clientes fiéis. Cada contato é
   registrado para não incomodar o cliente com lembretes repetidos. */
let G = { f:'inativos', q:'' };
const chaveFone = t => String(t||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'').replace(/^0+/,'');
const entregueEm = o => { const e = [...(o.historico||[])].reverse().find(x => x.para === 'Entregue'); return e ? e.data : null; };
const ultContato = (c, tipo) => (S.contatos[c.fone] || []).filter(x => x.tipo === tipo).slice(-1)[0];

function listaClientes(){
  const m = {};
  S.os.filter(o => o.status !== 'Cancelado').forEach(o => {
    const k = chaveFone(o.telefone); if(!k) return;
    const c = m[k] = m[k] || { fone:k, os:[], gasto:0 };
    c.os.push(o); c.gasto += pago(o);
  });
  return Object.values(m).map(c => {
    c.os.sort((a,b) => (a.entrada||'').localeCompare(b.entrada||'') || a.numero - b.numero);
    c.ultima = c.os[c.os.length - 1];
    c.nome = c.ultima.cliente; c.telefone = c.ultima.telefone;
    c.dias = diasEntre(c.ultima.entrada + 'T12:00', hoje() + 'T12:00');
    c.abertas = c.os.filter(o => aberta(o) || o.status === 'Pronto').length;   // ainda tem trabalho com a loja
    return c;
  });
}
function inativos(){
  return listaClientes().filter(c => !c.abertas && c.dias >= C().diasRetorno &&
    (!ultContato(c,'retorno') || diasEntre(ultContato(c,'retorno').data, agora()) >= 30));
}
function posVendas(){
  return listaClientes().filter(c => {
    const o = c.ultima; if(o.status !== 'Entregue') return false;
    const e = entregueEm(o); if(!e) return false;
    const d = diasEntre(e, agora()), pv = ultContato(c,'posvenda');
    return d >= 2 && d <= 10 && (!pv || pv.data < e);
  });
}
function segCli(f){
  const l = listaClientes();
  if(f === 'inativos') return inativos().sort((a,b) => b.dias - a.dias);
  if(f === 'esfriando') return l.filter(c => !c.abertas && c.dias >= Math.floor(C().diasRetorno/2) && c.dias < C().diasRetorno).sort((a,b) => b.dias - a.dias);
  if(f === 'posvenda') return posVendas();
  if(f === 'vip') return l.filter(c => c.os.length >= 4).sort((a,b) => b.gasto - a.gasto);
  return l.sort((a,b) => a.nome.localeCompare(b.nome));
}
function vCli(){
  const segs = [['inativos','😴 Inativos'],['esfriando','⏳ Esfriando'],['posvenda','💌 Pós-venda'],['vip','⭐ Fiéis'],['todos','👥 Todos']];

  </div>
  <div class="seg" style="margin-bottom:8px">${segs.map(([k,t]) =>
    `<button class="b ${G.f===k?'':'sec'} sm" onclick="G.f='${k}';vCli()">${t} (${segCli(k).length})</button>`).join('')}</div>
  <div class="card"><input placeholder="🔍 Buscar cliente ou telefone" value="${h(G.q)}" oninput="G.q=this.value;vCliLista()"></div>
  <div id="listaCli"></div>`;
  vCliLista();
}
function vCliLista(){
  const q = G.q.trim().toLowerCase(), qd = G.q.replace(/\D/g,'');
  const l = segCli(G.f).filter(c => !q || c.nome.toLowerCase().includes(q) || (qd.length >= 3 && c.fone.includes(qd)));
  document.getElementById('listaCli').innerHTML = l.map(c => {

    </div>`;
  }).join('') || '<div class="card hint">Nenhum cliente nesta lista por enquanto ✅</div>';
}
function enviarCli(fone, tipo){
  const c = listaClientes().find(x => x.fone === fone); if(!c) return;
  const v = { nome:(c.nome||'').trim().split(/\s+/)[0], item:itemMsg(c.ultima), numero:c.ultima.numero,

              horario:UN(c.ultima.unidade).horario, dias:c.dias };
  const texto = (C().msgs[tipo] || '').replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
  if(Canal.enviar({ telefone:c.telefone }, tipo, texto)){

    c.ultima.historico.push({ data:agora(), de:c.ultima.status, para:c.ultima.status,
      nota:`Cliente contatado no WhatsApp (${tipo === 'posvenda' ? 'pós-venda' : 'convite para voltar'})` });
    save(); render();
  }
}

function restaurar(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.os) || !d.config) throw 0;
      if(confirm('Substituir TODOS os dados atuais por este backup?')){
        S = d; S.contatos = S.contatos || {}; S.os = S.os || [];
        S.config = Object.assign({}, PADRAO.config, S.config);
        S.config.tempos = Object.assign({}, PADRAO.config.tempos, S.config.tempos || {});
        S.config.msgs   = Object.assign({}, PADRAO.config.msgs,   S.config.msgs   || {});
        migrar(); save(); render(); alert('Backup restaurado ✅');
      }
    } catch(e){ alert('Arquivo inválido ou corrompido.'); }
  };
  r.readAsText(f);
}
function zerar(){
  if(!confirm('Apagar TODAS as OS e voltar à configuração inicial?')) return;

/* ============ ANIMAÇÕES (não alteram nenhuma função do sistema) ============ */
function contar(el){
  const t = el.textContent.trim(); let alvo, fmt;
  if(/^\d+$/.test(t)){ alvo = +t; fmt = v => String(Math.round(v)); }
  else if(/^R\$/.test(t)){ alvo = parseFloat(t.replace(/[^\d,]/g,'').replace(',','.')); fmt = v => R(v); }
  else return;
  if(!(alvo > 0)) return;
  const ini = performance.now(), dur = 900;
  const passo = n => { const p = Math.min(1,(n-ini)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(alvo*e); if(p < 1) requestAnimationFrame(passo); else el.textContent = t; };
  requestAnimationFrame(passo);
}
function animar(){
  const alvos = document.querySelectorAll('#app > .card, #app > .grid > .card, #lista > .card, #listaCli > .card, #app > .seg');
  alvos.forEach((el,i) => { el.classList.remove('rv'); void el.offsetWidth; el.style.animationDelay = Math.min(i,14)*45 + 'ms'; el.classList.add('rv'); });
  document.querySelectorAll('.kpi b').forEach(contar);
}

render = function(){ _render(); animar(); };

  }

  /* ---------- sincronização inicial ---------- */
  async function sincronizar(){
    status('Carregando seus dados…');
    try{
      const { data, error } = await comTimeout(sb.from(TABELA).select('dados').eq('id', LINHA).maybeSingle(), 15000);
      if(error) throw error;
      const local = localStorage.getItem(CHAVE_LOCAL);
      if(data && !localStorage.getItem('sap_pendente')){
        localStorage.setItem(CHAVE_LOCAL, JSON.stringify(data.dados));          // nuvem manda
      }else if(local){
        const r = await comTimeout(sb.from(TABELA).upsert({ id: LINHA, dados: JSON.parse(local), atualizado_em: new Date().toISOString() }), 15000);
        if(r.error) throw r.error;                                               // 1ª migração ou alteração pendente
        localStorage.removeItem('sap_pendente');
      }
      selo('ok', 'Conectado à nuvem');
    }catch(e){
      console.error(e);
      selo('er', msgBanco(e) || 'Sem conexão — usando dados deste aparelho');
    }
  }

  function abrirSistema(){
    byId('login').hidden = true;
    byId('nuvem-sair').onclick = async () => { try{ await sb.auth.signOut(); }catch(e){} location.reload(); };
    const s = document.createElement('script');
    s.textContent = byId('app-code').textContent;
    document.body.appendChild(s);
  }

  (async function iniciar(){
    try{
      let sessao = null;
      try{ sessao = (await comTimeout(sb.auth.getSession(), 8000)).data.session; }catch(e){ sessao = null; }
      if(!sessao) await pedirLogin();
      await sincronizar();
      abrirSistema();
    }catch(e){
      console.error(e);
      falhaGrave('Algo deu errado ao abrir o sistema. Recarregue a página.');
    }
  })();
})();
</script>
